<style>
body{display:grid;grid-template-columns:236px 1fr;grid-template-rows:60px 1fr;height:100dvh;overflow:hidden}
body.collapsed{grid-template-columns:64px 1fr}
.side{grid-row:1/3;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);cursor:pointer;flex-shrink:0}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex-shrink:0}
.brand b{font:800 18px var(--display);letter-spacing:-.02em;white-space:nowrap}.brand b span{color:var(--accent)}
.nav{flex:1;overflow:auto;padding:12px 10px}
.nav .grp{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;padding:14px 10px 6px;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a.on{background:var(--glow);color:var(--accent)}
.nav a svg{width:18px;height:18px;flex-shrink:0}
.nav a .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto}
.side-foot{border-top:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:6px}
body.collapsed .brand b,body.collapsed .nav .grp,body.collapsed .nav a span,body.collapsed .side-foot .lbl{display:none}
body.collapsed .nav a{justify-content:center}
.top{display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--surface);min-width:0}
.projsel{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:10px;padding:4px 6px 4px 12px;background:var(--bg)}
.projsel span{font:600 9.5px var(--mono);letter-spacing:.12em;color:var(--faint)}
.projsel select{border:none;background:transparent;font-weight:600;font-size:13px;padding:4px 2px;width:auto;max-width:240px;box-shadow:none}
.cloudtag{font:600 10px var(--mono);padding:3px 8px;border-radius:10px;background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal)}
.avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--border2);object-fit:cover;cursor:pointer;background:var(--surface2);display:grid;place-items:center;font-weight:700}
.tabsbar{display:flex;align-items:center;gap:4px;overflow-x:auto;flex:1;min-width:0;padding:0 6px}
.ttab{display:flex;align-items:center;gap:7px;padding:6px 6px 6px 11px;border-radius:9px;border:1px solid transparent;background:none;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;flex-shrink:0}
.ttab:hover{color:var(--text);background:var(--surface2)}
.ttab.on{color:var(--text);background:var(--surface2);border-color:var(--border2)}
.ttab .x{padding:0 6px;border-radius:5px;font-size:11px}.ttab .x:hover{color:var(--danger)}
.ttab i{font-style:normal;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stage{position:relative;min-height:0;min-width:0}
@media (prefers-reduced-motion:no-preference){iframe.tool.on{animation:fhIn .4s cubic-bezier(.2,.7,.2,1) both}#home{animation:fhIn .4s ease both}}
.home-view{position:absolute;inset:0;overflow:auto}
iframe.tool{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg);display:none}
iframe.tool.on{display:block}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 26px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.hero h1{font:800 34px var(--display);letter-spacing:-.02em;margin:4px 0 6px;line-height:1.05}
.kick{font:600 10px var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.hero .meta{font-size:12.5px;color:var(--muted)}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.inproj{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto}
.inproj a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;background:var(--bg);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:12.5px;cursor:pointer}
.inproj a:hover{border-color:var(--accent)}
.inproj a i{font:10.5px var(--mono);color:var(--muted);font-style:normal;margin-left:auto}
.inproj a::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green)}
.members{display:flex;margin-top:12px}.members span{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;display:grid;place-items:center;font:700 11px var(--sans);background:var(--surface3)}.members span:first-child{margin-left:0}
.start{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.start>div{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .15s}
.start>div:hover{border-color:var(--accent)}
.start .n{font:700 22px var(--display);color:var(--accent)}.start b{display:block;margin:4px 0 2px}.start p{font-size:12px;color:var(--muted)}
.start>div.done{opacity:.55}.start>div.done .n::after{content:' ✓';color:var(--green)}
@media(max-width:1100px){.start{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
.searchrow{display:flex;gap:10px;align-items:center;margin-bottom:24px}
.search{position:relative;max-width:340px;flex:1}.search input{padding-left:34px}.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:9px;top:8px;font:10.5px var(--mono);border:1px solid var(--border2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.section{margin-bottom:38px;scroll-margin-top:20px}
.sechead{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.sechead .n{font:800 46px var(--display);color:var(--border2);line-height:.8}
.sechead h2{font:800 28px var(--display);letter-spacing:-.02em}
.sechead p{color:var(--muted);font-size:13px}
.sub{font:600 10px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin:20px 0 10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;min-height:196px;position:relative}
.tcard:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
.tcard .ic{width:42px;height:42px;border-radius:12px;background:var(--glow);color:var(--accent);display:grid;place-items:center}
.tcard .ic svg{width:21px;height:21px}
.tcard h3{font:700 17.5px var(--display)}
.tcard p{font-size:12.5px;color:var(--muted);flex:1;line-height:1.55}
.tcard .foot{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.tcard .tags{font:500 10.5px var(--mono);color:var(--faint);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .pin{position:absolute;top:14px;right:14px;border:none;background:none;color:var(--faint);padding:4px;border-radius:6px}
.tcard .pin svg{width:16px;height:16px}.tcard .pin.on{color:var(--accent)}.tcard .pin:hover{color:var(--text);background:var(--surface2)}
.tcard .inp{font:600 10.5px var(--mono);color:var(--green);white-space:nowrap}
.tcard .open{font:600 12px var(--sans);color:var(--accent);opacity:0;transition:opacity .15s;white-space:nowrap}.tcard:hover .open{opacity:1}
.tcard.guide{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 65%)}
.tcard.soon{cursor:default;opacity:.6}.tcard.soon:hover{transform:none;border-color:var(--border);box-shadow:none}
.tcard .ver{font:600 10px var(--mono);border:1px solid var(--border2);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tcard.hide{display:none}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.prow{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.prow.cur{border-color:var(--accent)}.prow b{flex:1;font-weight:600}.prow i{font:10.5px var(--mono);color:var(--muted);font-style:normal}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}.mem b{flex:1;font-weight:500}
.top{grid-column:2;grid-row:1}.stage{grid-column:2;grid-row:2}
.menu-btn{display:none}
.scrim{display:none}
@media(max-width:820px){
  body,body.collapsed{grid-template-columns:1fr;grid-template-rows:56px 1fr}
  .top,.stage{grid-column:1}
  .top{padding:0 10px;gap:6px}
  .menu-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);font-size:18px;flex-shrink:0}
  .side{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:70;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  body.collapsed .brand b,body.collapsed .nav .grp,body.collapsed .nav a span,body.collapsed .side-foot .lbl{display:initial}
  body.collapsed .nav a{justify-content:flex-start}
  body.navopen .side{transform:none}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}
  #b-collapse{display:none}
  .tabsbar{display:none}
  .projsel{padding:2px 4px 2px 8px;min-width:0;flex:1}.projsel span{display:none}.projsel select{max-width:none;width:100%;font-size:13px}
  #b-share{padding:7px 10px}
  #b-signin{padding:7px 10px}
  .hide-sm{display:none!important}
  .wrap{padding:16px 14px 70px}
  .hero{padding:18px;border-radius:14px}.hero h1{font-size:26px}
  .start{grid-template-columns:1fr 1fr;gap:8px}.start>div{padding:12px}
  .sechead .n{font-size:32px}.sechead h2{font-size:22px}
  .grid3{grid-template-columns:1fr}
  .tcard{min-height:0}
  .tcard .open{opacity:1}
}
</style>
</head>

  <div class="brand" id="go-home"><div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff6f4" stroke-width="2.4"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div><b>Film<span>Hub</span></b></div>

function newProject(){ FH.prompt('New project','Project name (e.g. Heating Gun)','', n=>{ if(!n) return; const ps=FH.projects(); const p={id:FH.uid(), name:n, created:Date.now()}; ps.push(p); FH.LS.set('fh:projects', ps); switchProject(p.id); }, 'Create project'); }
function manageProjects(){
  const ps=FH.projects(), cur=FH.currentId();

  <div class="acts"><button class="btn" id="pm-backup">Backup this project</button><button class="btn" id="pm-restore">Restore a backup</button><span class="spacer"></span><button class="btn accent" id="pm-new">＋ New project</button></div>`, true);
  b.querySelector('#pm-new').onclick=()=>{ FH.close(); newProject(); };
  b.querySelector('#pm-backup').onclick=backup; b.querySelector('#pm-restore').onclick=()=>$('restore-file').click();
  b.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{ FH.close(); switchProject(x.dataset.open); });
  b.querySelectorAll('[data-ren]').forEach(x=>x.onclick=()=>{ const p=ps.find(q=>q.id===x.dataset.ren); FH.prompt('Rename project','Project name',p.name,n=>{ if(!n) return; p.name=n; FH.LS.set('fh:projects',ps); if(p.cloud) Cloud.rename(p.id,n); renderProjects(); renderHome(); }); });
  b.querySelectorAll('[data-dup]').forEach(x=>x.onclick=()=>{ const src=ps.find(q=>q.id===x.dataset.dup); const p={id:FH.uid(), name:src.name+' copy', created:Date.now()}; Object.keys(localStorage).filter(k=>k.startsWith('fh:data:'+src.id+':')).forEach(k=>localStorage.setItem(k.replace(src.id,p.id), localStorage.getItem(k))); ps.push(p); FH.LS.set('fh:projects',ps); renderProjects(); manageProjects(); });
  b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{ const p=ps.find(q=>q.id===x.dataset.del); if(ps.length<2){ FH.toast('Keep at least one project.'); return; }
    const leave=p.cloud&&p.owner!==Cloud.uid();
    FH.confirm(`${leave?'Leave':'Delete'} ${p.name}?`, leave?'You will lose access until someone invites you again.':p.cloud?'It is deleted online for everyone in it. This cannot be undone.':'Everything saved for it in this browser is removed. Make a backup first if you might want it back.', leave?'Leave':'Delete project', async ()=>{
      if(p.cloud){ try{ leave?await Cloud.leave(p.id):await Cloud.remove(p.id); }catch(e){ FH.toast(FHCloud.explain(e)); return; } }
      Object.keys(localStorage).filter(k=>k.startsWith('fh:data:'+p.id+':')||k.startsWith('fh:touched:'+p.id+':')).forEach(k=>localStorage.removeItem(k)); const rest=FH.projects().filter(q=>q.id!==p.id); FH.LS.set('fh:projects',rest); if(cur===p.id) FH.LS.set('fh:current',rest[0].id); renderProjects(); renderHome(); manageProjects(); }); });
}
function backup(){ const p=FH.currentProject(); const data={format:'film-hub-backup', version:2, project:{name:p.name}, savedAt:new Date().toISOString(), tools:{}};
  Object.keys(localStorage).filter(k=>k.startsWith('fh:data:'+p.id+':')).forEach(k=>{ try{ data.tools[k.split(':').pop()]=JSON.parse(localStorage.getItem(k)); }catch(e){} });
  FH.download(p.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'-film-hub-backup.json', JSON.stringify(data,null,1), 'application/json'); }
$('restore-file').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(d.format!=='film-hub-backup') throw 0; const ps=FH.projects(); const p={id:FH.uid(), name:(d.project&&d.project.name||'Restored project')+' (restored)', created:Date.now()}; ps.push(p); FH.LS.set('fh:projects',ps);
    Object.entries(d.tools||{}).forEach(([t,v])=>{ FH.LS.set('fh:data:'+p.id+':'+t, v); FH.LS.set('fh:touched:'+p.id+':'+t, Date.now()); }); FH.close(); switchProject(p.id); }
  catch(err){ FH.toast('That file is not a Film Hub backup.'); } };

/* ---------- cloud: Google sign-in, shared projects, live sync ---------- */
const Cloud={ me:null, unsubList:null, unsubProj:null, pushT:{}, pushing:{},
  uid(){ return Cloud.me&&Cloud.me.uid; },
  init(){ renderAcct(); FHCloud.ready().then(()=>{ FHCloud.onAuth(u=>{ Cloud.me=u; renderAcct(); Cloud.listProjects(); Cloud.watchProject(); renderHome(); }); }).catch(()=>{ renderAcct(true); }); },
  listProjects(){ if(Cloud.unsubList){ Cloud.unsubList(); Cloud.unsubList=null; }
    if(!Cloud.me){ const ps=FH.projects().filter(p=>!p.cloud); if(!ps.length) ps.push({id:FH.uid(),name:'My first project',created:Date.now()}); FH.LS.set('fh:projects',ps); renderProjects(); return; }
    Cloud.unsubList=FHCloud.db().collection('hubProjects').where('members','array-contains',FHCloud.email()).onSnapshot(snap=>{
      const local=FH.projects().filter(p=>!p.cloud); const cloud=snap.docs.map(d=>{ const v=d.data(); return {id:d.id, name:v.name, cloud:true, owner:v.owner, ownerName:v.ownerName, ownerEmail:v.ownerEmail||'', members:v.members||[], names:v.names||{}, created:v.created||Date.now()}; });
      FH.LS.set('fh:projects',[...local.filter(p=>!cloud.some(c=>c.id===p.id)),...cloud]);
      const j=new URLSearchParams(location.search).get('join'); if(j&&cloud.some(c=>c.id===j)&&FH.currentId()!==j){ history.replaceState(null,'',location.pathname); switchProject(j); }
      renderProjects(); renderHome(); if(!FH.projects().some(p=>p.id===FH.currentId())) switchProject(FH.projects()[0].id); },
      err=>FH.toast(FHCloud.explain(err))); },
  watchProject(){ if(Cloud.unsubProj){ Cloud.unsubProj(); Cloud.unsubProj=null; } const p=FH.currentProject(); renderProjects(); if(!p||!p.cloud||!Cloud.me) return;
    Cloud.unsubProj=FHCloud.db().collection('hubProjects').doc(p.id).collection('tools').onSnapshot(snap=>{ snap.docChanges().forEach(ch=>{ if(ch.type==='removed') return; const v=ch.doc.data(), k=`fh:data:${p.id}:${ch.doc.id}`;
        if(typeof v.json!=='string' || localStorage.getItem(k)===v.json || Cloud.pushing[k]===v.json) return;
        try{ localStorage.setItem(k, v.json); FH.LS.set('fh:touched:'+p.id+':'+ch.doc.id, v.updatedAt||Date.now()); }catch(e){ FH.toast('This browser is full; some shared data could not be stored.'); }
        if(v.by!==Cloud.me.uid && !snap.metadata.hasPendingWrites) setState(`↓ ${v.byName||'Someone'} updated ${T(ch.doc.id)?T(ch.doc.id).name:ch.doc.id}`); });
      // tell open tools in this window (storage events only reach other windows)
      document.querySelectorAll('iframe.tool').forEach(f=>{ try{ f.contentWindow.dispatchEvent(new StorageEvent('storage',{key:'fh:remote'})); }catch(e){} }); if(active==='home') renderHome(); },
      err=>FH.toast(FHCloud.explain(err))); },
  push(k, json){ const p=FH.currentProject(); const [, , pid, tool]=k.split(':'); if(!p||p.id!==pid||!p.cloud||!Cloud.me) return;
    clearTimeout(Cloud.pushT[k]); Cloud.pushT[k]=setTimeout(async()=>{ if(json.length>950000){ FH.toast(`${T(tool)?T(tool).name:tool} is too big to share (lots of images). Use smaller or fewer images.`); return; }
      Cloud.pushing[k]=json; setState('Syncing…'); try{ await FHCloud.db().collection('hubProjects').doc(pid).collection('tools').doc(tool).set({json, updatedAt:Date.now(), by:Cloud.me.uid, byName:Cloud.me.displayName||Cloud.me.email}); await FHCloud.db().collection('hubProjects').doc(pid).update({updated:Date.now()}); setState('☁ Synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})); }catch(e){ setState('Not synced'); FH.toast(FHCloud.explain(e)); } }, 900); },
  async makeShared(p){ const db=FHCloud.db(); const me=Cloud.me; await db.collection('hubProjects').doc(p.id).set({name:p.name, owner:me.uid, ownerName:me.displayName||me.email, ownerEmail:FHCloud.email(), members:[FHCloud.email()], names:{[FHCloud.email()]:me.displayName||''}, created:p.created||Date.now(), updated:Date.now()});
    for(const k of Object.keys(localStorage).filter(k=>k.startsWith('fh:data:'+p.id+':'))){ await db.collection('hubProjects').doc(p.id).collection('tools').doc(k.split(':').pop()).set({json:localStorage.getItem(k), updatedAt:Date.now(), by:me.uid, byName:me.displayName||me.email}); }
    const ps=FH.projects(); const q=ps.find(x=>x.id===p.id); Object.assign(q,{cloud:true, owner:me.uid, members:[FHCloud.email()]}); FH.LS.set('fh:projects',ps); Cloud.watchProject(); },
  invite(pid, email){ return FHCloud.db().collection('hubProjects').doc(pid).update({members:firebase.firestore.FieldValue.arrayUnion(email.toLowerCase().trim())}); },
  uninvite(pid, email){ return FHCloud.db().collection('hubProjects').doc(pid).update({members:firebase.firestore.FieldValue.arrayRemove(email)}); },
  leave(pid){ return Cloud.uninvite(pid, FHCloud.email()); },
  async remove(pid){ const db=FHCloud.db(); const t=await db.collection('hubProjects').doc(pid).collection('tools').get(); for(const d of t.docs) await d.ref.delete(); await db.collection('hubProjects').doc(pid).delete(); },
  rename(pid,n){ FHCloud.db().collection('hubProjects').doc(pid).update({name:n}).catch(e=>FH.toast(FHCloud.explain(e))); },
};
window.addEventListener('storage', e=>{ if(e.key&&e.key.startsWith('fh:data:')&&e.newValue!=null) Cloud.push(e.key, e.newValue); if(e.key&&e.key.startsWith('fh:touched')){ renderNav(); if(active==='home') renderHome(); } });

  if(!p.cloud){ FH.modal(`<h3>Put “${esc(p.name)}” online?</h3><p>Everything in this project (shot list, budget, schedule…) is copied to your Firebase database. Then you can invite people by email and edit together. Your Lighting Planner keeps its own sharing.</p><div class="acts"><button class="btn" onclick="FH.close()">Cancel</button><button class="btn accent" id="mk">Share this project</button></div>`);

function saveTabs(){ FH.LS.set('fh:open', open); FH.LS.set('fh:pins', pins); }
function renderTabs(){ const list=[...new Set([...pins.filter(id=>T(id)&&!T(id).soon), ...open])];
  $('tabs').innerHTML=list.map(id=>`<button class="ttab ${active===id?'on':''}" data-t="${id}">${pins.includes(id)?'<i title="Pinned"></i>':''}${esc(T(id).name)}${pins.includes(id)?'':`<span class="x" data-x="${id}" title="Close">✕</span>`}</button>`).join('');
  document.querySelectorAll('.ttab').forEach(b=>b.onclick=e=>{ if(e.target.dataset.x){ closeTool(e.target.dataset.x); return; } openTool(b.dataset.t); }); }
function frameFor(t){ let f=document.querySelector(`iframe.tool[data-id="${t.id}"]`); if(!f){ f=document.createElement('iframe'); f.className='tool'; f.dataset.id=t.id; f.title=t.name; f.src='tools/'+t.file; $('stage').appendChild(f); } return f; }
function openTool(id){ const t=T(id); if(!t||t.soon) return;
  if(t.alias){ openTool(t.alias); const f=frameFor(T(t.alias)); const send=()=>{ try{ f.contentWindow.postMessage({fh:'tab', tab:t.tab},'*'); }catch(e){} }; send(); f.addEventListener('load',send,{once:true}); return; }
  if(!open.includes(id)) open.push(id); active=id; saveTabs();
  $('home').style.display='none'; document.querySelectorAll('iframe.tool').forEach(f=>f.classList.remove('on')); frameFor(t).classList.add('on'); FH.sweep&&FH.sweep();
  renderTabs(); renderNav(); if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); document.title=t.name+' · Film Hub'; }
function closeTool(id){ open=open.filter(x=>x!==id); const f=document.querySelector(`iframe.tool[data-id="${id}"]`); if(f) f.remove(); saveTabs(); if(active===id) goHome(); else renderTabs(); }
function goHome(sec){ active='home'; document.querySelectorAll('iframe.tool').forEach(f=>f.classList.remove('on')); $('home').style.display='block'; renderTabs(); renderNav(); renderHome(); history.replaceState(null,'',location.pathname+location.search); document.title='Film Hub'; }
$('go-home').onclick=()=>goHome();
window.addEventListener('message',e=>{ if(e.data&&e.data.fh==='open'&&T(e.data.id)) openTool(e.data.id); });

/* ---------- home ---------- */
function card(t){ const touched=t.file&&FH.touched(t.id), pin=pins.includes(t.id);
  if(t.guide) return `<div class="tcard guide" data-open="${t.id}"><span class="kick">Pipeline guide · start here</span><div class="ic">${svg(t.id)}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><div class="foot"><span class="tags">Checklist · glossary</span><span class="open">Open →</span></div></div>`;
  return `<div class="tcard ${t.soon?'soon':''}" data-open="${t.id}" data-search="${esc((t.name+' '+t.desc+' '+(t.tags||'')).toLowerCase())}">${t.soon?'':`<button class="pin ${pin?'on':''}" data-pin="${t.id}" title="${pin?'Unpin':'Pin to the tab bar'}">${svg('pin')}</button>`}<div class="ic">${svg(t.id)}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><div class="foot"><span class="tags">${esc(t.tags||'')}</span>${touched?'<span class="inp">● In project</span>':''}${t.soon?'<span class="ver">Coming soon</span>':`<span class="open">Open →</span>`}</div></div>`; }
function renderHome(){ if(active!=='home') return; const p=FH.currentProject(); const used=TOOLS.filter(t=>t.file&&!t.guide&&!t.hidden&&FH.touched(t.id)).sort((a,b)=>FH.touched(b.id)-FH.touched(a.id));
  const steps=[['Name your project','Projects menu at the top, e.g. “Heating Gun”.',()=>FH.projects().some(q=>q.name!=='My first project'),manageProjects],['Sign in with Google','So you can share and open it anywhere.',()=>!!Cloud.me,()=>{ const b=$('b-signin'); b?b.click():null; }],['Invite your crew','Share → add their Gmail.',()=>!!(p.cloud&&(p.members||[]).length>1),shareModal],['Start with the script','Then mood board, shot list, lighting…',()=>!!FH.touched('script'),()=>openTool('script')]];
  let h=`<div class="hero"><div><span class="kick">Current project ${p.cloud?'· ☁ shared':''}</span><h1>${esc(p.name)}</h1><div class="meta">${used.length?'Last edited '+ago(FH.touched(used[0].id)):'Nothing saved yet — open a tool to start'} · ${p.cloud?'saved online, live with your team':'saved in this browser'}</div>
    ${p.cloud?`<div class="members">${(p.members||[]).slice(0,8).map(m=>`<span title="${esc(m)}">${esc(initials(m))}</span>`).join('')}</div>`:''}
    <div class="acts"><button class="btn accent" id="h-share">${p.cloud?'Invite people':'Share project'}</button><button class="btn" id="h-new">New project</button><button class="btn ghost" id="h-manage">Manage</button></div></div>
    <div><div class="label">In this project</div><div class="inproj">${used.length?used.map(t=>`<a data-open="${t.id}">${esc(t.name)}<i>${ago(FH.touched(t.id))}</i></a>`).join(''):'<p class="hint">Tools you use for this project will show up here.</p>'}</div></div></div>`;
  if(!FH.LS.get('fh:hide-start')) h+=`<div style="display:flex;align-items:center;margin-bottom:10px"><span class="label" style="margin:0">Getting started</span><span class="spacer"></span><button class="btn sm ghost" id="hide-start">Hide</button></div><div class="start">${steps.map((s,i)=>`<div data-step="${i}" class="${s[2]()?'done':''}"><span class="n">${i+1}</span><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div>`;
  h+=`<div class="searchrow"><div class="search">${svg('search')}<input type="search" id="q" placeholder="Find a tool…"><kbd>/</kbd></div><span class="hint hide-sm">Open a tool and it gets a tab at the top. Pin the ones you use every day.</span></div>`;
  SECTIONS.forEach(s=>{ const ts=TOOLS.filter(t=>t.sec===s.id); h+=`<div class="section" id="sec-${s.id}"><div class="sechead"><span class="n">${s.n}</span><div><h2>${s.name}</h2><p>${s.p}</p></div></div>`;
    const guides=ts.filter(t=>t.guide), subs=[...new Set(ts.filter(t=>!t.guide).map(t=>t.sub||''))];
    if(guides.length) h+=`<div class="grid3" style="margin-bottom:6px">${guides.map(card).join('')}</div>`;
    subs.forEach(sb=>{ if(sb) h+=`<div class="sub">${esc(sb)}</div>`; h+=`<div class="grid3">${ts.filter(t=>!t.guide&&(t.sub||'')===sb).map(card).join('')}</div>`; }); h+='</div>'; });
  $('home-inner').innerHTML=h;
  $('h-manage').onclick=manageProjects; $('h-new').onclick=newProject; $('h-share').onclick=shareModal;
  const hs=$('hide-start'); if(hs) hs.onclick=()=>{ FH.LS.set('fh:hide-start',true); renderHome(); };
  document.querySelectorAll('[data-step]').forEach(d=>d.onclick=()=>steps[+d.dataset.step][3]());
  document.querySelectorAll('[data-open]').forEach(c=>c.onclick=e=>{ const pb=e.target.closest('[data-pin]'); if(pb){ e.stopPropagation(); const id=pb.dataset.pin; pins=pins.includes(id)?pins.filter(x=>x!==id):[...pins,id]; saveTabs(); renderHome(); renderTabs(); return; } openTool(c.dataset.open); });
  const q=$('q'); q.oninput=()=>{ const v=q.value.trim().toLowerCase(); document.querySelectorAll('.tcard[data-search]').forEach(c=>c.classList.toggle('hide', !!v && !c.dataset.search.includes(v))); };
}
document.addEventListener('keydown',e=>{ if(e.key==='/' && active==='home' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ e.preventDefault(); const q=$('q'); if(q) q.focus(); } });
setInterval(()=>{ if(!$('hub-state').textContent.startsWith('↓')&&!FH.currentProject().cloud){ const last=Math.max(0,...TOOLS.filter(t=>t.file).map(t=>FH.touched(t.id))); setState(last?'● Saved '+new Date(last).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''); } }, 4000);

renderProjects(); renderNav(); renderTabs(); renderHome(); Cloud.init();
const start=location.hash.slice(1); if(start && T(start)) openTool(start);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h && T(h) && h!==active) openTool(h); });
</script>
</body>
</html>
