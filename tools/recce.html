<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Location Recce</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css">
<style>
.list{display:flex;flex-direction:column;gap:6px}
.li{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;display:flex;gap:10px;align-items:center}
.li:hover{border-color:var(--accent)}.li.on{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.li img{width:44px;height:34px;object-fit:cover;border-radius:4px}.li .ph{width:44px;height:34px;border-radius:4px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.li b{display:block;font-size:12.5px}.li i{font:10px var(--mono);font-style:normal;color:var(--muted)}
.stars span{font-size:20px;cursor:pointer;color:var(--border2)}.stars span.on{color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photos figure{position:relative;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:4/3}.photos img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos button{position:absolute;top:4px;right:4px}.photos figcaption input{position:absolute;left:0;right:0;bottom:0;border-radius:0;background:rgba(0,0,0,.65);border:none;font-size:11px;padding:4px 6px}
.drop{border:1px dashed var(--border2);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:12px}.drop.over{border-color:var(--accent);color:var(--accent)}
.sec h4{font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin:14px 0 8px}
table.cmp{width:100%;border-collapse:collapse;font-size:12px}table.cmp td,table.cmp th{border:1px solid var(--border);padding:7px 9px;vertical-align:top;text-align:left}table.cmp th{background:var(--surface2);font:500 10px var(--mono);letter-spacing:.08em;color:var(--muted)}
</style></head><body>
<div class="wrap"><div class="layout">
  <div><div class="card"><div class="label">Locations</div><div class="list" id="list"></div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn accent" id="b-add">+ Location</button><button class="btn" id="b-cmp">Compare</button><button class="btn" id="b-field">Blank field sheet</button></div></div>
  <div class="card"><p class="hint">Visit at the time of day you'll shoot. Check where the sun is, listen for 5 minutes (traffic, planes, fridges, neighbours), count sockets and find the fuse board, and take wide photos from every corner.</p></div></div>
  <div id="ed"></div>
</div></div>
<script src="common.js"></script>
<script>
FH.header({kicker:'02 · Prep · Places', name:'Location Recce', actions:'<button class="btn accent" id="b-print">Print write-up</button>'});
const FIELDS=[
 ['Basics',[['name','Location name'],['address','Address / what3words','long'],['contact','Owner / contact'],['phone','Phone / email'],['scenes','Scenes it could be'],['type','INT / EXT','sel',['INT','EXT','INT / EXT']],['cost','Cost / fee'],['dates','Available dates']]],
 ['Access',[['access','Access & load-in (stairs, lifts, doors)','long'],['parking','Parking / unit base','long'],['transport','Public transport']]],
 ['Power',[['power','Sockets, fuse board, circuits','long'],['gen','Generator needed?','sel',['No','Maybe','Yes']]]],
 ['Sound',[['sound','Noise: traffic, planes, neighbours, fridges, HVAC','long'],['soundok','Sound rating','sel',['Good','OK','Problem']]]],
 ['Light',[['orient','Windows / orientation (N/S/E/W)'],['sunpath','Sun path & best time of day','long'],['practicals','Practicals & existing lights','long'],['blackout','Can we black out windows?','sel',['Yes','Partly','No']]]],
 ['Safety & facilities',[['safety','Hazards (stairs, water, roads, public)','long'],['toilets','Toilets / green room / holding','long'],['hospital','Nearest A&E'],['permits','Permits / permissions','long']]],
 ['Notes',[['notes','Overall notes','long']]],
];
let data=FH.load('recce', ()=>({cur:null, locs:[]}));
let cur=data.locs.find(l=>l.id===data.cur)||data.locs[0];
const e=FH.esc;
function save(){ FH.save('recce',data); }
function list(){ document.getElementById('list').innerHTML=data.locs.length?data.locs.map(l=>`<div class="li ${l===cur?'on':''}" data-id="${l.id}">${l.photos&&l.photos[0]?`<img src="${l.photos[0].src}">`:'<span class="ph">📍</span>'}<div style="flex:1;min-width:0"><b>${e(l.name||'Untitled location')}</b><i>${'★'.repeat(l.rating||0)}${'☆'.repeat(5-(l.rating||0))} · ${e(l.type||'')} ${l.status?'· '+e(l.status):''}</i></div></div>`).join(''):'<p class="hint">No locations yet.</p>'; document.querySelectorAll('.li').forEach(x=>x.onclick=()=>{ cur=data.locs.find(l=>l.id===x.dataset.id); data.cur=cur.id; save(); list(); ed(); }); }
function ed(){ const el=document.getElementById('ed'); if(!cur){ el.innerHTML='<div class="empty">Add a location to start your recce.</div>'; return; }
  el.innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<span data-s="${n}" class="${n<=(cur.rating||0)?'on':''}">★</span>`).join('')}</div><select id="status" style="width:auto">${['Scouting','Shortlisted','Booked','Rejected'].map(s=>`<option ${s===cur.status?'selected':''}>${s}</option>`).join('')}</select><span class="spacer"></span><button class="btn danger sm" id="b-del">Delete location</button></div>
  ${FIELDS.map(([sec,fs])=>`<div class="sec"><h4>${sec}</h4><div class="row2">${fs.map(([k,l,t,o])=>`<div class="field" style="${t==='long'?'grid-column:span 2':''}"><label>${e(l)}</label>${t==='long'?`<textarea data-k="${k}" style="min-height:54px">${e(cur[k]||'')}</textarea>`:t==='sel'?`<select data-k="${k}"><option></option>${o.map(x=>`<option ${x===cur[k]?'selected':''}>${x}</option>`).join('')}</select>`:`<input type="text" data-k="${k}" value="${e(cur[k]||'')}">`}</div>`).join('')}</div></div>`).join('')}
  <div class="sec"><h4>Photos</h4><div class="drop" id="drop">Drop photos here, paste them, or <label style="color:var(--accent);cursor:pointer">choose files<input type="file" id="ph" accept="image/*" multiple hidden></label></div><div class="photos" id="photos" style="margin-top:10px"></div></div></div>`;
  el.querySelectorAll('[data-k]').forEach(i=>i.oninput=i.onchange=()=>{ cur[i.dataset.k]=i.value; save(); if(i.dataset.k==='name'||i.dataset.k==='type') list(); });
  el.querySelectorAll('[data-s]').forEach(s=>s.onclick=()=>{ cur.rating=+s.dataset.s; save(); list(); ed(); });
  document.getElementById('status').onchange=ev=>{ cur.status=ev.target.value; save(); list(); };
  document.getElementById('b-del').onclick=()=>FH.confirm(`Delete ${cur.name||'this location'}?`,'Its notes and photos are removed.','Delete',()=>{ data.locs=data.locs.filter(l=>l!==cur); cur=data.locs[0]; save(); list(); ed(); });
  const drop=document.getElementById('drop'); drop.ondragover=ev=>{ ev.preventDefault(); drop.classList.add('over'); }; drop.ondragleave=()=>drop.classList.remove('over'); drop.ondrop=ev=>{ ev.preventDefault(); drop.classList.remove('over'); addPhotos(ev.dataTransfer.files); };
  document.getElementById('ph').onchange=ev=>{ addPhotos(ev.target.files); ev.target.value=''; };
  photos(); }
function photos(){ const p=cur.photos||[]; document.getElementById('photos').innerHTML=p.map((x,i)=>`<figure><img src="${x.src}" data-i="${i}"><button class="ib del" data-del="${i}">✕</button><figcaption><input type="text" data-cap="${i}" value="${e(x.cap||'')}" placeholder="Caption (e.g. view from door)"></figcaption></figure>`).join('');
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ cur.photos.splice(+b.dataset.del,1); save(); photos(); list(); });
  document.querySelectorAll('[data-cap]').forEach(i=>i.oninput=()=>{ cur.photos[+i.dataset.cap].cap=i.value; save(); });
  document.querySelectorAll('.photos img').forEach(im=>im.onclick=()=>FH.modal(`<img src="${im.src}" style="width:100%;border-radius:6px"><div class="acts"><button class="btn accent" onclick="FH.close()">Close</button></div>`,true)); }
async function addPhotos(files){ files=[...files].filter(f=>f.type.startsWith('image/')); if(!files.length) return; cur.photos=cur.photos||[];
  for(const f of files){ try{ cur.photos.push({src:await FH.fileToDataURL(f,1100,.78), cap:''}); }catch(err){} }
  save(); photos(); list(); FH.toast(files.length+' photo(s) added. Photos are kept small so they fit in the browser.'); }
document.addEventListener('paste', ev=>{ if(!cur) return; const fs=[...(ev.clipboardData?ev.clipboardData.items:[])].filter(i=>i.kind==='file').map(i=>i.getAsFile()); if(fs.length){ ev.preventDefault(); addPhotos(fs); } });
document.getElementById('b-add').onclick=()=>{ cur={id:FH.uid(), name:'', status:'Scouting', rating:0, photos:[]}; data.locs.push(cur); data.cur=cur.id; save(); list(); ed(); document.querySelector('[data-k="name"]').focus(); };
document.getElementById('b-cmp').onclick=()=>{ if(data.locs.length<2){ FH.toast('Add at least two locations to compare.'); return; }
  const rows=[['Rating',l=>'★'.repeat(l.rating||0)],['Status',l=>l.status],['Type',l=>l.type],['Cost',l=>l.cost],['Access',l=>l.access],['Parking',l=>l.parking],['Power',l=>l.power],['Sound',l=>(l.soundok?'['+l.soundok+'] ':'')+(l.sound||'')],['Light',l=>(l.orient||'')+' '+(l.sunpath||'')],['Black out',l=>l.blackout],['Safety',l=>l.safety],['Facilities',l=>l.toilets],['Notes',l=>l.notes]];
  FH.modal(`<h3>Compare locations</h3><div style="overflow:auto"><table class="cmp"><tr><th></th>${data.locs.map(l=>`<th>${l.photos&&l.photos[0]?`<img src="${l.photos[0].src}" style="width:100%;max-width:200px;border-radius:4px;display:block;margin-bottom:6px">`:''}${e(l.name||'Untitled')}</th>`).join('')}</tr>${rows.map(([k,f])=>`<tr><th>${k}</th>${data.locs.map(l=>`<td>${e(f(l)||'—')}</td>`).join('')}</tr>`).join('')}</table></div><div class="acts"><button class="btn accent" onclick="FH.close()">Done</button></div>`,true); };
document.getElementById('b-field').onclick=()=>{ const h=`<h1>Location recce — field sheet</h1><p class="muted">${e(FH.currentProject().name)} · Date: ________ · Time: ________ · Recce by: ______________</p>`+FIELDS.map(([sec,fs])=>`<h2>${sec}</h2><table>${fs.map(([k,l])=>`<tr><th style="width:34%">${e(l)}</th><td style="height:${/long/.test(String(fs.find(x=>x[0]===k)[2]))?'52px':'26px'}"></td></tr>`).join('')}</table>`).join('')+'<h2>Sketch / floor plan</h2><div style="height:220px;border:1px solid #bbb"></div>'; FH.previewSheet(h,'Recce field sheet'); };
document.getElementById('b-print').onclick=()=>{ const h=`<h1>${e(FH.currentProject().name)} — Locations</h1>`+data.locs.map(l=>`<h2>${e(l.name||'Untitled')} · ${'★'.repeat(l.rating||0)} · ${e(l.status||'')}</h2><table>${FIELDS.flatMap(([s,fs])=>fs).filter(([k])=>l[k]).map(([k,lab])=>`<tr><th style="width:30%">${e(lab)}</th><td>${e(l[k]).replace(/\n/g,'<br>')}</td></tr>`).join('')}</table>${(l.photos||[]).length?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px">${l.photos.map(p=>`<div><img src="${p.src}" style="width:100%;border-radius:3px"><div class="muted" style="font-size:10px">${e(p.cap||'')}</div></div>`).join('')}</div>`:''}`).join(''); FH.previewSheet(h,'Locations'); };
list(); ed();
FH.onProjectChange(()=>location.reload());
</script></body></html>
