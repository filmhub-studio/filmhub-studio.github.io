<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Script Breakdown</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.sub{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.view{flex:1;min-height:0;display:flex}
.lp{width:260px;border-right:1px solid var(--border);overflow:auto;background:var(--surface);flex-shrink:0}
.rp{width:300px;border-left:1px solid var(--border);overflow:auto;padding:14px;background:var(--surface);flex-shrink:0}
.mid{flex:1;overflow:auto;padding:26px 20px;min-width:0}
.sc{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.sc:hover{background:var(--bg)}.sc.on{background:var(--bg);box-shadow:inset 3px 0 var(--accent)}
.sc .n{font:600 12px var(--mono);color:var(--accent);min-width:22px}.sc .h{font-size:12px;font-weight:600;line-height:1.3}.sc .m{font:10px var(--mono);color:var(--muted);margin-top:3px}
.page{max-width:640px;margin:0 auto;background:#fdfcf8;color:#16181d;padding:40px 54px;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.35);font:14px/1.45 'Courier Prime',monospace;white-space:pre-wrap;user-select:text}
.page .slug{font-weight:700;text-transform:uppercase;margin-bottom:12px}
.page mark{border-radius:2px;padding:0 1px;color:inherit;cursor:pointer}
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:8px;display:none;flex-wrap:wrap;gap:4px;max-width:330px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.pop button{border:1px solid var(--border2);background:var(--bg);color:var(--text);border-radius:14px;padding:4px 9px;font:500 11px var(--sans);cursor:pointer;display:flex;align-items:center;gap:5px}
.pop button i,.cat i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cat{margin-bottom:12px}.cat h4{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 5px;display:flex;align-items:center;gap:6px}
.el{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 4px 2px 8px;border-radius:12px;margin:0 4px 4px 0;border:1px solid var(--border2)}
.el button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:11px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.meta>*{min-width:0}.meta input,.meta select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:6px 8px}
.empty{max-width:560px;margin:60px auto;text-align:center}
@media(max-width:820px){.lp{width:150px}.rp{display:none}.page{padding:22px 18px;font-size:12.5px}}
</style></head><body>
<div class="sub no-print"><div class="seg" id="tabs"><button data-t="tag" class="on">Tag script</button><button data-t="report">Breakdown sheets</button><button data-t="elements">All elements</button></div>
<span class="spacer"></span><button class="btn" id="b-load">Load script…</button><button class="btn" id="b-csv">CSV</button><button class="btn" id="b-sched">→ Schedule</button><button class="btn accent" id="b-print">Print / PDF</button></div>
<div class="view" id="view"></div>
<div class="pop" id="pop"></div>
<input type="file" id="pdf" accept="application/pdf,.fountain,.txt" hidden>
<script src="common.js"></script>
<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id), e=FH.esc;
const CATS=[['cast','Cast','#ff5d6c'],['extras','Extras / BG','#ffb86b'],['stunts','Stunts','#d8666d'],['props','Props','#b39dff'],['wardrobe','Wardrobe','#7aa7ff'],['makeup','Hair & make-up','#ff7ab8'],['set','Set dressing','#5ee0a0'],['vehicles','Vehicles','#34d3b6'],['animals','Animals','#c8a26b'],['sfx','Special effects','#ffd166'],['vfx','VFX','#8ef0ff'],['sound','Sound / music','#9aa4b8'],['camera','Special equipment','#d0d0d0'],['notes','Notes','#ffffff']];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],c]));
FH.header({kicker:'02 · Prep', name:'Script Breakdown', help:'<p><b>1.</b> Load your script: from Script Development, a PDF, or paste the text. Scenes are found from the INT./EXT. headings.</p><p><b>2.</b> Select words in the scene (cast names, props, costumes…) and pick a category. Every later mention in that scene is highlighted too. Click a highlight to remove it.</p><p><b>3.</b> Check the sheets, export CSV, or send the scenes to the Shooting Schedule.</p>'});
let D=FH.load('breakdown', ()=>({text:'', src:'', tags:[], meta:{}, cur:0, tab:'tag'}));
let scenes=[];
function save(){ FH.save('breakdown', D); }
function parse(text){ const L=String(text||'').replace(/\r/g,'').split('\n'); const out=[]; let cur=null;
  const isH=l=>/^\s*(\d+[A-Z]?\.?\s+)?(INT|EXT|INT\.?\/EXT|I\/E|EST)[\.\s]/i.test(l)||/^\s*\.[A-Z]/.test(l);
  L.forEach(l=>{ if(isH(l)){ cur={head:l.trim().replace(/^\./,'').replace(/\s+\d+[A-Z]?\.?$/,''), lines:[]}; out.push(cur); } else if(cur) cur.lines.push(l); else { if(l.trim()){ cur={head:'OPENING', lines:[l]}; out.push(cur); } } });
  return out.map((s,i)=>{ const h=s.head.replace(/^\d+[A-Z]?\.?\s+/,''); const m=h.match(/^(INT\.?\/EXT|I\/E|INT|EXT|EST)[\.\s]+(.*?)(?:\s+[-–—]\s+(.*))?$/i)||[];
    const body=s.lines.join('\n').replace(/^\n+|\n+$/g,''); const lines=s.lines.length+2;
    return {i, num:String(i+1), head:s.head, ie:(m[1]||'').toUpperCase().replace('.','').replace('I/E','INT/EXT'), set:(m[2]||h).trim(), dn:(m[3]||'').trim().toUpperCase(), body, eighths:Math.max(1,Math.round(lines/55*8))}; }); }
function eighths(n){ const p=Math.floor(n/8), r=n%8; return (p?p+(r?' ':''):'')+(r?r+'/8':'')||'1/8'; }
function rebuild(){ scenes=parse(D.text); scenes.forEach(s=>{ const m=D.meta[s.num]||{}; Object.assign(s,m); }); if(D.cur>=scenes.length) D.cur=0; }
rebuild();
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ D.tab=b.dataset.t; save(); show(); });
function show(){ document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===D.tab)); if(!scenes.length) return empty(); ({tag, report, elements})[D.tab](); }
function empty(){ const sd=(FH.load('script',{})||{}).text; $('view').innerHTML=`<div class="mid"><div class="empty"><h2 style="font-family:var(--display)">Load a script to break down</h2><p class="hint">Scenes are split on headings like “INT. KITCHEN - NIGHT”.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px">${sd?'<button class="btn accent" id="e-sd">Use my script from Script Development</button>':''}<button class="btn" id="e-pdf">Upload PDF / .fountain</button><button class="btn" id="e-paste">Paste text</button></div></div></div>`;
  if(sd) $('e-sd').onclick=()=>setText(sd,'Script Development'); $('e-pdf').onclick=()=>$('pdf').click(); $('e-paste').onclick=paste; }
function setText(t,src){ D.text=t; D.src=src; D.cur=0; save(); rebuild(); show(); FH.toast(scenes.length+' scenes found.'); }
function paste(){ FH.modal(`<h3>Paste your script</h3><textarea id="pt" style="height:300px;font:12px 'Courier Prime',monospace" placeholder="INT. KITCHEN - NIGHT&#10;&#10;Anna drops the keys..."></textarea><div class="acts"><button class="btn" onclick="FH.close()">Cancel</button><button class="btn accent" id="pok">Use this</button></div>`); $('pok').onclick=()=>{ const t=$('pt').value; FH.close(); if(t.trim()) setText(t,'pasted'); }; }
$('b-load').onclick=()=>{ const sd=(FH.load('script',{})||{}).text; FH.modal(`<h3>Load script</h3><p class="hint">Your tags stay attached to scene numbers and words, so reloading a revised draft keeps most of them.</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${sd?'<button class="btn accent" id="l-sd">From Script Development</button>':''}<button class="btn" id="l-pdf">PDF or .fountain file</button><button class="btn" id="l-paste">Paste text</button></div><div class="acts"><button class="btn" onclick="FH.close()">Close</button></div>`);
  if(sd) $('l-sd').onclick=()=>{ FH.close(); setText(sd,'Script Development'); }; $('l-pdf').onclick=()=>{ FH.close(); $('pdf').click(); }; $('l-paste').onclick=()=>{ FH.close(); paste(); }; };
$('pdf').onchange=async ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){ setText(await f.text(), f.name); return; }
  if(!window.pdfjsLib){ FH.toast('The PDF reader needs internet to load.'); return; }
  FH.toast('Reading '+f.name+'…'); const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let out=[];
  for(let p=1;p<=pdf.numPages;p++){ const tc=await (await pdf.getPage(p)).getTextContent(); let lastY=null, line=''; tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); if(lastY!==null&&Math.abs(y-lastY)>2){ out.push(line); if(lastY-y>20) out.push(''); line=''; } line+=(line&&!line.endsWith(' ')&&!it.str.startsWith(' ')?'':'')+it.str; lastY=y; }); out.push(line,''); }
  setText(out.join('\n').replace(/^\s*\d+\.\s*$/gm,''), f.name); };
function tagsFor(num){ return D.tags.filter(t=>t.sc===num); }
function highlight(text, tags){ let html=e(text); const sorted=[...tags].sort((a,b)=>b.text.length-a.text.length); const marks=[];
  sorted.forEach(t=>{ const re=new RegExp('(^|[^\\w])('+e(t.text).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=[^\\w]|$)','gi'); html=html.replace(re,(m,a,b)=>{ marks.push(`<mark data-tag="${t.id}" title="${CAT[t.cat][1]} — click to remove" style="background:${CAT[t.cat][2]}55;box-shadow:inset 0 -2px ${CAT[t.cat][2]}">${b}</mark>`); return a+'\u0000'+(marks.length-1)+'\u0001'; }); });
  return html.replace(/\u0000(\d+)\u0001/g,(m,i)=>marks[+i]); }
function tag(){ const s=scenes[D.cur];
  $('view').innerHTML=`<div class="lp">${scenes.map((x,i)=>`<div class="sc ${i===D.cur?'on':''}" data-s="${i}"><span class="n">${e(x.num)}</span><div><div class="h">${e(x.head)}</div><div class="m">${eighths(x.eighths)} pg · ${tagsFor(x.num).length} tags</div></div></div>`).join('')}</div>
  <div class="mid" id="mid"><div class="page" id="page"><div class="slug">${e(s.num)}. ${e(s.head)}</div>${highlight(s.body,tagsFor(s.num))}</div><p class="hint" style="text-align:center;margin-top:12px">Select a word or phrase to tag it · ← → for the previous / next scene</p></div>
  <div class="rp" id="rp"></div>`;
  side(); document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{ D.cur=+x.dataset.s; save(); tag(); });
  $('page').onmouseup=()=>setTimeout(selPop,10); $('page').ontouchend=()=>setTimeout(selPop,300);
  $('page').querySelectorAll('mark').forEach(m=>m.onclick=()=>{ const t=D.tags.find(x=>x.id===m.dataset.tag); if(t) FH.confirm(`Remove “${t.text}”?`,`${CAT[t.cat][1]} in scene ${t.sc}`,'Remove',()=>{ D.tags=D.tags.filter(x=>x!==t); save(); tag(); }); });
  const on=document.querySelector('.sc.on'); on&&on.scrollIntoView({block:'nearest'}); }
function side(){ const s=scenes[D.cur], tg=tagsFor(s.num), m=D.meta[s.num]||{};
  $('rp').innerHTML=`<div class="label">Scene ${e(s.num)}</div><div class="meta"><div class="field"><label>I/E</label><select data-m="ie">${['','INT','EXT','INT/EXT'].map(o=>`<option ${o===s.ie?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>Day / night</label><input data-m="dn" value="${e(s.dn)}"></div><div class="field" style="grid-column:1/3"><label>Set / location</label><input data-m="set" value="${e(s.set)}"></div><div class="field"><label>Pages (eighths)</label><input type="number" min="1" data-m="eighths" value="${s.eighths}"></div><div class="field"><label>Est. hours</label><input type="number" step=".25" data-m="hrs" value="${e(m.hrs??'')}" placeholder="2"></div><div class="field" style="grid-column:1/3"><label>Synopsis</label><input data-m="syn" value="${e(m.syn||'')}" placeholder="One line"></div></div>
  ${CATS.map(([k,l,c])=>{ const xs=tg.filter(t=>t.cat===k); return xs.length?`<div class="cat"><h4><i style="background:${c}"></i>${l}</h4>${xs.map(t=>`<span class="el" style="border-color:${c}88">${e(t.text)}<button data-rm="${t.id}">✕</button></span>`).join('')}</div>`:''; }).join('')||'<p class="hint">Nothing tagged in this scene yet. Select text on the page.</p>'}
  <button class="btn" style="width:100%;margin-top:6px" id="addm">+ Add element not in the text</button>`;
  $('rp').querySelectorAll('[data-m]').forEach(i=>i.onchange=()=>{ D.meta[s.num]=Object.assign(D.meta[s.num]||{}, {[i.dataset.m]:i.type==='number'?+i.value:i.value}); save(); rebuild(); });
  $('rp').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ D.tags=D.tags.filter(t=>t.id!==b.dataset.rm); save(); tag(); });
  $('addm').onclick=()=>{ FH.modal(`<h3>Add element to scene ${e(s.num)}</h3><div class="field"><label>Element</label><input id="am" placeholder="e.g. Rain machine"></div><div class="field"><label>Category</label><select id="ac">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div><div class="acts"><button class="btn" onclick="FH.close()">Cancel</button><button class="btn accent" id="aok">Add</button></div>`); $('aok').onclick=()=>{ const t=$('am').value.trim(); FH.close(); if(t) addTag(t,$('ac').value); }; }; }
function addTag(text,cat){ const s=scenes[D.cur]; if(!D.tags.some(t=>t.sc===s.num&&t.cat===cat&&t.text.toLowerCase()===text.toLowerCase())) D.tags.push({id:FH.uid(), sc:s.num, text, cat}); D.last=cat; save(); tag(); }
function selPop(){ const sel=getSelection(), t=sel.toString().replace(/\s+/g,' ').trim(), pop=$('pop'); if(!t||t.length>60||!$('page').contains(sel.anchorNode)){ pop.style.display='none'; return; }
  const r=sel.getRangeAt(0).getBoundingClientRect(); pop.innerHTML=CATS.map(([k,l,c])=>`<button data-c="${k}" ${k===D.last?'style="border-color:var(--accent)"':''}><i style="background:${c}"></i>${l}</button>`).join('');
  pop.style.display='flex'; pop.style.left=Math.min(innerWidth-340,Math.max(8,r.left))+'px'; pop.style.top=(r.bottom+8+200>innerHeight?r.top-pop.offsetHeight-8:r.bottom+8)+'px';
  pop.querySelectorAll('[data-c]').forEach(b=>b.onmousedown=ev=>{ ev.preventDefault(); pop.style.display='none'; getSelection().removeAllRanges(); addTag(t,b.dataset.c); }); }
document.addEventListener('mousedown',ev=>{ if(!$('pop').contains(ev.target)) $('pop').style.display='none'; });
document.addEventListener('keydown',ev=>{ if(D.tab!=='tag'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return; if(ev.key==='ArrowDown'||ev.key==='ArrowRight'){ D.cur=Math.min(scenes.length-1,D.cur+1); save(); tag(); } if(ev.key==='ArrowUp'||ev.key==='ArrowLeft'){ D.cur=Math.max(0,D.cur-1); save(); tag(); } });
function sheet(s){ const tg=tagsFor(s.num), m=D.meta[s.num]||{}; return `<div class="card" style="margin-bottom:14px;break-inside:avoid"><div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><h3 style="margin:0;font-family:var(--display)">Scene ${e(s.num)}</h3><b>${e(s.ie)} ${e(s.set)}</b><span class="hint">${e(s.dn)}</span><span class="spacer"></span><span class="hint">${eighths(s.eighths)} pages${m.hrs?' · '+m.hrs+' h':''}</span></div>${m.syn?`<p style="margin:6px 0 0">${e(m.syn)}</p>`:''}
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px">${CATS.map(([k,l,c])=>{ const xs=[...new Set(tg.filter(t=>t.cat===k).map(t=>t.text))]; return xs.length?`<div style="border-top:3px solid ${c};padding-top:6px"><div class="label" style="margin:0 0 4px">${l}</div>${xs.map(x=>`<div style="font-size:12.5px">${e(x)}</div>`).join('')}</div>`:''; }).join('')}</div></div>`; }
function report(){ $('view').innerHTML=`<div class="mid"><div style="max-width:900px;margin:0 auto">${scenes.map(sheet).join('')}</div></div>`; }
function elements(){ const by={}; D.tags.forEach(t=>{ const k=t.cat+'|'+t.text.toLowerCase(); (by[k]=by[k]||{cat:t.cat,text:t.text,sc:new Set()}).sc.add(t.sc); });
  const L=Object.values(by).sort((a,b)=>CATS.findIndex(c=>c[0]===a.cat)-CATS.findIndex(c=>c[0]===b.cat)||a.text.localeCompare(b.text));
  $('view').innerHTML=`<div class="mid"><div style="max-width:900px;margin:0 auto"><table class="grid"><thead><tr><th>Category</th><th>Element</th><th>Scenes</th><th>Count</th></tr></thead><tbody>${L.map(x=>`<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${CAT[x.cat][2]};margin-right:6px"></span>${CAT[x.cat][1]}</td><td><b>${e(x.text)}</b></td><td>${[...x.sc].join(', ')}</td><td>${x.sc.size}</td></tr>`).join('')||'<tr><td colspan="4" class="hint">No tags yet.</td></tr>'}</tbody></table></div></div>`; }
$('b-csv').onclick=()=>{ const rows=[['Scene','I/E','Set','D/N','Pages','Category','Element']]; scenes.forEach(s=>{ const tg=tagsFor(s.num); if(!tg.length) rows.push([s.num,s.ie,s.set,s.dn,eighths(s.eighths),'','']); tg.forEach(t=>rows.push([s.num,s.ie,s.set,s.dn,eighths(s.eighths),CAT[t.cat][1],t.text])); }); FH.download((FH.currentProject().name+'-breakdown.csv').replace(/\s+/g,'-'), FH.csv(rows), 'text/csv'); };
$('b-print').onclick=()=>{ FH.previewSheet(scenes.map(sheet).join(''), 'Script breakdown'); };
$('b-sched').onclick=()=>{ if(!scenes.length) return; FH.confirm('Send scenes to the Shooting Schedule?','Adds a new strip-board day called “From breakdown” with every scene (I/E, D/N, set, pages, cast). Your existing days stay as they are.','Send',()=>{
  const sch=FH.load('schedule', ()=>({cast:{groups:[{id:FH.uid(),name:'',rows:[]}]}, groups:[]})); const castRows=sch.cast.groups[0].rows; const idOf=name=>{ let r=castRows.find(x=>(x.character||'').toLowerCase()===name.toLowerCase()); if(!r){ r={id:FH.uid(), num:String(castRows.length+1), character:name, actor:''}; castRows.push(r); } return r.num; };
  const dn=x=>{ x=x.toUpperCase(); return x.includes('NIGHT')?'NIGHT':x.includes('DAWN')?'DAWN':x.includes('DUSK')||x.includes('EVENING')?'DUSK':'DAY'; };
  sch.groups.push({id:FH.uid(), name:'From breakdown', date:'', rows:scenes.map(s=>({id:FH.uid(), sc:s.num, ie:['INT','EXT','INT/EXT'].includes(s.ie)?s.ie:'INT', dn:dn(s.dn), set:s.set, desc:(D.meta[s.num]||{}).syn||'', pages:eighths(s.eighths), cast:[...new Set(tagsFor(s.num).filter(t=>t.cat==='cast').map(t=>idOf(t.text)))].join(','), hrs:(D.meta[s.num]||{}).hrs||2}))});
  FH.save('schedule', sch); FH.toast('Sent '+scenes.length+' scenes to the Shooting Schedule.'); }); };
show();
</script></body></html>
