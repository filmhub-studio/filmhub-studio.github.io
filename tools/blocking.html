<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Block Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css">
<style>
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;display:flex}
.lp{width:250px;border-right:1px solid var(--border);overflow:auto;padding:14px;background:var(--surface);flex-shrink:0}
.cvw{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#c{flex:1;min-height:0;width:100%;touch-action:none;background:var(--bg)}
.beats{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border);background:var(--surface);overflow-x:auto;align-items:center}
.beat{border:1px solid var(--border2);border-radius:9px;padding:6px 10px;min-width:120px;cursor:pointer;background:var(--bg);font-size:12px}
.beat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}.beat b{font:600 11px var(--mono);color:var(--accent);margin-right:5px}
.ch{display:grid;grid-template-columns:22px minmax(0,1fr) 22px;gap:6px;align-items:center;margin-bottom:6px}.ch input:not([type=color]){width:100%;min-width:0}
.ch input[type=color]{width:22px;height:22px;border:none;padding:0;background:none}
.sc{padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12.5px}.sc.on{background:var(--bg);box-shadow:inset 3px 0 var(--accent)}
.tb{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.note{padding:8px 12px;border-top:1px solid var(--border);background:var(--surface)}
.note textarea{min-height:38px;height:42px}
@media(max-width:820px){.lp{width:170px}}
</style></head><body>
<div class="view"><aside class="lp">
  <div class="label">Scenes</div><div id="scs"></div><button class="btn sm" id="sc-add" style="width:100%;margin:6px 0 16px">+ Scene</button>
  <div class="label">Characters</div><div id="chs"></div><button class="btn sm" id="ch-add" style="width:100%;margin:6px 0 16px">+ Character</button>
  <div class="label">Floor plan / location photo</div><div style="display:flex;gap:6px;flex-wrap:wrap"><label class="btn sm">📷 Add<input type="file" id="bgf" accept="image/*" hidden></label><button class="btn sm" id="bg-rm">Remove</button></div>
  <div class="field" style="margin-top:8px"><label>Photo opacity</label><input type="range" id="bgo" min="0.1" max="1" step="0.05" value="0.6"></div>
  <p class="hint" style="margin-top:12px">Drag people and cameras. Q / E or Shift-drag rotates. Each beat stores where everyone is; arrows show how they moved from the previous beat.</p>
</aside>
<div class="cvw"><div class="tb"><button class="btn sm" id="cam-add">🎥 Add camera</button><button class="btn sm" id="mark-add">✕ Add mark</button><button class="btn sm" id="play">▶ Play beats</button><button class="btn sm" id="fit">⊡ Centre</button><button class="btn sm" id="del">Delete selected</button></div>
<canvas id="c"></canvas>
<div class="note"><textarea id="bnote" placeholder="Beat note — action or dialogue cue, e.g. “ANNA: Where were you?” — she crosses to the window"></textarea></div>
<div class="beats" id="beats"></div></div></div>
<script src="common.js"></script>
<script>
const $=id=>document.getElementById(id), e=FH.esc;
FH.header({kicker:'02 · Prep', name:'Block Planner', actions:'<button class="btn" id="b-png">PNG</button><button class="btn" id="b-sl">→ Shot list notes</button><button class="btn accent" id="b-print">Print all beats</button>', help:'<p>Plan where the actors stand and move, beat by beat, and where the cameras go.</p><p>1. Add your characters. 2. Drag them into place for beat 1. 3. Add a beat (it copies the positions) and move people again. Arrows show each move. 4. Add cameras A, B… Press ▶ to watch the blocking play through.</p>'});
const PAL=['#ff9d7a','#7ad1ff','#b8ff7a','#ffd166','#d8a6ff','#ff7ab8','#5ee0d0','#ffffff'];
let D=FH.load('blocking', ()=>{ const c1=FH.uid(), c2=FH.uid(); return {chars:[{id:c1,name:'Anna',c:PAL[0]},{id:c2,name:'Tom',c:PAL[1]}], scenes:[{id:FH.uid(), name:'Scene 1', bg:null, cur:0, beats:[{id:FH.uid(), note:'', pos:{[c1]:{x:-120,y:0,r:0},[c2]:{x:120,y:0,r:180}}, cams:[{id:FH.uid(),x:0,y:260,r:-90,label:'A',lens:35}], marks:[]}]}], cur:0}; });
const V={x:0,y:0,z:1}; let sel=null, drag=null, playing=null, bgImg=null;
const cv=$('c'), cx=cv.getContext('2d');
function save(){ FH.save('blocking', D); }
const S=()=>D.scenes[D.cur], B=()=>S().beats[S().cur], PB=()=>S().beats[S().cur-1];
function resize(){ const d=devicePixelRatio||1, r=cv.getBoundingClientRect(); cv.width=r.width*d; cv.height=r.height*d; draw(); }
const toW=(px,py)=>{ const r=cv.getBoundingClientRect(); return {x:(px-r.left-r.width/2)/V.z-V.x, y:(py-r.top-r.height/2)/V.z-V.y}; };
function arrow(x1,y1,x2,y2,c){ const a=Math.atan2(y2-y1,x2-x1); cx.strokeStyle=c; cx.fillStyle=c; cx.lineWidth=2.5; cx.setLineDash([7,6]); cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2-14*Math.cos(a),y2-14*Math.sin(a)); cx.stroke(); cx.setLineDash([]); cx.beginPath(); cx.moveTo(x2-6*Math.cos(a),y2-6*Math.sin(a)); cx.lineTo(x2-20*Math.cos(a-.45),y2-20*Math.sin(a-.45)); cx.lineTo(x2-20*Math.cos(a+.45),y2-20*Math.sin(a+.45)); cx.closePath(); cx.fill(); }
function draw(over){ const d=devicePixelRatio||1, W=cv.width/d, H=cv.height/d, b=over||B(), pb=over?null:PB(); cx.setTransform(d,0,0,d,0,0); cx.clearRect(0,0,W,H);
  cx.save(); cx.translate(W/2,H/2); cx.scale(V.z,V.z); cx.translate(V.x,V.y);
  const bg=S().bg; if(bg&&bg.src){ if(!bgImg||bgImg._s!==bg.src){ bgImg=new Image(); bgImg._s=bg.src; bgImg.onload=()=>draw(); bgImg.src=bg.src; } if(bgImg.complete){ const w=bg.w||900, h=w*bgImg.naturalHeight/bgImg.naturalWidth; cx.globalAlpha=bg.o??.6; cx.drawImage(bgImg,-w/2,-h/2,w,h); cx.globalAlpha=1; } }
  cx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--border'); cx.lineWidth=1/V.z; for(let g=-2000;g<=2000;g+=50){ cx.globalAlpha=g%250?0.35:0.8; cx.beginPath(); cx.moveTo(g,-2000); cx.lineTo(g,2000); cx.moveTo(-2000,g); cx.lineTo(2000,g); cx.stroke(); } cx.globalAlpha=1;
  (b.marks||[]).forEach(m=>{ cx.strokeStyle=m.id===sel?'#fff':'#ffd166'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(m.x-9,m.y-9); cx.lineTo(m.x+9,m.y+9); cx.moveTo(m.x+9,m.y-9); cx.lineTo(m.x-9,m.y+9); cx.stroke(); if(m.t){ cx.fillStyle='#ffd166'; cx.font='600 11px Inter'; cx.fillText(m.t,m.x+12,m.y+4); } });
  b.cams.forEach(c=>{ const a=c.r*Math.PI/180, fov=2*Math.atan(18/(c.lens||35)); cx.fillStyle='rgba(122,167,255,.08)'; cx.beginPath(); cx.moveTo(c.x,c.y); cx.arc(c.x,c.y,600,a-fov/2,a+fov/2); cx.closePath(); cx.fill(); cx.save(); cx.translate(c.x,c.y); cx.rotate(a); cx.fillStyle='#1d2a3a'; cx.strokeStyle=c.id===sel?getComputedStyle(document.documentElement).getPropertyValue('--accent'):'#7aa7ff'; cx.lineWidth=2; cx.beginPath(); cx.roundRect(-16,-12,26,24,4); cx.fill(); cx.stroke(); cx.beginPath(); cx.moveTo(10,-7); cx.lineTo(22,-12); cx.lineTo(22,12); cx.lineTo(10,7); cx.closePath(); cx.fill(); cx.stroke(); cx.restore(); cx.fillStyle='#7aa7ff'; cx.font='700 13px JetBrains Mono'; cx.textAlign='center'; cx.fillText(c.label+' · '+(c.lens||35)+'mm',c.x,c.y-22); });
  D.chars.forEach(ch=>{ const p=b.pos[ch.id]; if(!p) return; const q=pb&&pb.pos[ch.id]; if(q&&Math.hypot(q.x-p.x,q.y-p.y)>8){ cx.globalAlpha=.35; cx.fillStyle=ch.c; cx.beginPath(); cx.arc(q.x,q.y,16,0,7); cx.fill(); cx.globalAlpha=1; arrow(q.x,q.y,p.x,p.y,ch.c); } });
  D.chars.forEach(ch=>{ const p=b.pos[ch.id]; if(!p) return; const a=p.r*Math.PI/180; cx.fillStyle=ch.c; cx.strokeStyle=ch.id===sel?'#fff':'rgba(0,0,0,.5)'; cx.lineWidth=ch.id===sel?3:1.5; cx.beginPath(); cx.arc(p.x,p.y,19,0,7); cx.fill(); cx.stroke(); cx.fillStyle='rgba(0,0,0,.65)'; cx.beginPath(); cx.moveTo(p.x+Math.cos(a)*27,p.y+Math.sin(a)*27); cx.lineTo(p.x+Math.cos(a+.5)*17,p.y+Math.sin(a+.5)*17); cx.lineTo(p.x+Math.cos(a-.5)*17,p.y+Math.sin(a-.5)*17); cx.closePath(); cx.fill(); cx.fillStyle='#111'; cx.font='700 13px Inter'; cx.textAlign='center'; cx.fillText(ch.name.slice(0,2).toUpperCase(),p.x,p.y+4.5); cx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text'); cx.font='600 12px Inter'; cx.fillText(ch.name,p.x,p.y+36); });
  cx.restore(); cx.textAlign='left'; }
function hit(w){ const b=B(); for(const ch of D.chars){ const p=b.pos[ch.id]; if(p&&Math.hypot(p.x-w.x,p.y-w.y)<22) return {o:p,id:ch.id}; } for(const c of b.cams) if(Math.hypot(c.x-w.x,c.y-w.y)<22) return {o:c,id:c.id}; for(const m of b.marks||[]) if(Math.hypot(m.x-w.x,m.y-w.y)<14) return {o:m,id:m.id}; return null; }
cv.onpointerdown=ev=>{ if(playing) return; cv.setPointerCapture(ev.pointerId); const w=toW(ev.clientX,ev.clientY), h=hit(w); if(h){ sel=h.id; drag={o:h.o, dx:w.x-h.o.x, dy:w.y-h.o.y, rot:ev.shiftKey}; } else { sel=null; drag={pan:true, sx:ev.clientX, sy:ev.clientY, vx:V.x, vy:V.y}; } draw(); };
cv.onpointermove=ev=>{ if(!drag) return; if(drag.pan){ V.x=drag.vx+(ev.clientX-drag.sx)/V.z; V.y=drag.vy+(ev.clientY-drag.sy)/V.z; } else { const w=toW(ev.clientX,ev.clientY); if(drag.rot&&drag.o.r!=null) drag.o.r=Math.round(Math.atan2(w.y-drag.o.y,w.x-drag.o.x)*180/Math.PI/5)*5; else { drag.o.x=Math.round(w.x-drag.dx); drag.o.y=Math.round(w.y-drag.dy); } } draw(); };
cv.onpointerup=()=>{ if(drag&&!drag.pan) save(); drag=null; };
cv.onwheel=ev=>{ ev.preventDefault(); V.z=Math.min(3,Math.max(.3,V.z*(ev.deltaY<0?1.1:1/1.1))); draw(); };
cv.ondblclick=ev=>{ const h=hit(toW(ev.clientX,ev.clientY)); if(!h) return; const c=B().cams.find(x=>x.id===h.id), m=(B().marks||[]).find(x=>x.id===h.id);
  if(c) FH.prompt('Camera','Label and lens, e.g. “A 50”',c.label+' '+(c.lens||35),t=>{ const [l,mm]=t.split(/\s+/); c.label=l||c.label; c.lens=+mm||c.lens; save(); draw(); });
  else if(m) FH.prompt('Mark','Label (optional)',m.t||'',t=>{ m.t=t; save(); draw(); }); };
document.addEventListener('keydown',ev=>{ if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return; const b=B(); const o=b.pos[sel]||b.cams.find(c=>c.id===sel);
  if(o&&(ev.key==='q'||ev.key==='e')){ o.r=(o.r||0)+(ev.key==='e'?15:-15); save(); draw(); } if((ev.key==='Delete'||ev.key==='Backspace')&&sel) delSel(); if(ev.key==='ArrowRight') go(S().cur+1); if(ev.key==='ArrowLeft') go(S().cur-1); });
function delSel(){ const b=B(); if(b.cams.some(c=>c.id===sel)) b.cams=b.cams.filter(c=>c.id!==sel); else if((b.marks||[]).some(m=>m.id===sel)) b.marks=b.marks.filter(m=>m.id!==sel); else if(b.pos[sel]) delete b.pos[sel]; sel=null; save(); draw(); side(); }
$('del').onclick=delSel;
$('cam-add').onclick=()=>{ const b=B(), L='ABCDEFGH'[b.cams.length]||'X'; const c={id:FH.uid(), x:-V.x+80*b.cams.length, y:-V.y+220, r:-90, label:L, lens:35}; b.cams.push(c); sel=c.id; save(); draw(); };
$('mark-add').onclick=()=>{ const b=B(); b.marks=b.marks||[]; const m={id:FH.uid(), x:-V.x, y:-V.y, t:''}; b.marks.push(m); sel=m.id; save(); draw(); };
$('fit').onclick=()=>{ V.x=0; V.y=0; V.z=1; draw(); };
function go(i){ if(i<0||i>=S().beats.length) return; S().cur=i; save(); beats(); draw(); }
function beats(){ const s=S(); $('beats').innerHTML=s.beats.map((b,i)=>`<div class="beat ${i===s.cur?'on':''}" data-b="${i}"><b>${i+1}</b>${e((b.note||'Beat').slice(0,30))}</div>`).join('')+'<button class="btn sm" id="b-add">+ Beat</button>'+(s.beats.length>1?'<button class="btn sm" id="b-rm">Delete beat</button>':'');
  $('beats').querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>go(+x.dataset.b));
  $('b-add').onclick=()=>{ const cur=B(); const nb=JSON.parse(JSON.stringify(cur)); nb.id=FH.uid(); nb.note=''; s.beats.splice(s.cur+1,0,nb); s.cur++; save(); beats(); draw(); $('bnote').focus(); };
  if($('b-rm')) $('b-rm').onclick=()=>FH.confirm('Delete beat '+(s.cur+1)+'?','','Delete',()=>{ s.beats.splice(s.cur,1); s.cur=Math.max(0,s.cur-1); save(); beats(); draw(); });
  $('bnote').value=B().note||''; }
$('bnote').oninput=()=>{ B().note=$('bnote').value; save(); const el=document.querySelector('.beat.on'); if(el) el.innerHTML=`<b>${S().cur+1}</b>${e((B().note||'Beat').slice(0,30))}`; };
function side(){ $('scs').innerHTML=D.scenes.map((s,i)=>`<div class="sc ${i===D.cur?'on':''}" data-s="${i}">${e(s.name)} <span class="hint">· ${s.beats.length} beats</span></div>`).join('');
  $('scs').querySelectorAll('[data-s]').forEach(x=>{ x.onclick=()=>{ D.cur=+x.dataset.s; save(); bgImg=null; side(); beats(); draw(); }; x.ondblclick=()=>FH.prompt('Scene name','Name',S().name,t=>{ S().name=t; save(); side(); }); });
  $('chs').innerHTML=D.chars.map((c,i)=>`<div class="ch"><input type="color" value="${c.c}" data-cc="${i}"><input value="${e(c.name)}" data-cn="${i}"><button class="ib" data-cr="${i}" title="Remove">✕</button></div>`).join('')+`${D.chars.some(c=>!B().pos[c.id])?'<p class="hint">Some characters are not in this beat. <a href="#" id="put">Place them</a></p>':''}`;
  $('chs').querySelectorAll('[data-cc]').forEach(i=>i.oninput=()=>{ D.chars[+i.dataset.cc].c=i.value; save(); draw(); });
  $('chs').querySelectorAll('[data-cn]').forEach(i=>i.oninput=()=>{ D.chars[+i.dataset.cn].name=i.value; save(); draw(); });
  $('chs').querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>FH.confirm('Remove '+D.chars[+b.dataset.cr].name+'?','From every scene and beat.','Remove',()=>{ D.chars.splice(+b.dataset.cr,1); save(); side(); draw(); }));
  const put=$('put'); if(put) put.onclick=ev=>{ ev.preventDefault(); D.chars.forEach((c,i)=>{ if(!B().pos[c.id]) B().pos[c.id]={x:-V.x+i*50-60,y:-V.y-80,r:90}; }); save(); side(); draw(); };
  $('bgo').value=(S().bg&&S().bg.o)||0.6; }
$('ch-add').onclick=()=>{ const c={id:FH.uid(), name:'Character '+(D.chars.length+1), c:PAL[D.chars.length%PAL.length]}; D.chars.push(c); S().beats.forEach(b=>b.pos[c.id]={x:-V.x,y:-V.y,r:90}); save(); side(); draw(); };
$('sc-add').onclick=()=>FH.prompt('New scene','Name','Scene '+(D.scenes.length+1),t=>{ const pos={}; D.chars.forEach((c,i)=>pos[c.id]={x:i*60-60,y:0,r:90}); D.scenes.push({id:FH.uid(), name:t, bg:null, cur:0, beats:[{id:FH.uid(), note:'', pos, cams:[], marks:[]}]}); D.cur=D.scenes.length-1; bgImg=null; save(); side(); beats(); draw(); });
$('bgf').onchange=async ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(!f) return; S().bg={src:await FH.fileToDataURL(f,1600,.8), w:900, o:0.6}; bgImg=null; save(); draw(); };
$('bg-rm').onclick=()=>{ S().bg=null; save(); draw(); }; $('bgo').oninput=()=>{ if(S().bg){ S().bg.o=+$('bgo').value; save(); draw(); } };
$('play').onclick=()=>{ if(playing){ cancelAnimationFrame(playing); playing=null; $('play').textContent='▶ Play beats'; draw(); return; } const s=S(); if(s.beats.length<2){ FH.toast('Add a second beat first.'); return; } $('play').textContent='■ Stop'; let i=0, t0=performance.now();
  const lerp=(a,b,k)=>a+(b-a)*k, ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const step=now=>{ const k=Math.min(1,(now-t0)/1400), A=s.beats[i], Bb=s.beats[i+1]; const pos={}; D.chars.forEach(c=>{ const a=A.pos[c.id], b=Bb.pos[c.id]||a; if(a) pos[c.id]={x:lerp(a.x,b.x,ease(k)),y:lerp(a.y,b.y,ease(k)),r:lerp(a.r,b.r,ease(k))}; }); draw({pos, cams:Bb.cams, marks:Bb.marks});
    if(k>=1){ i++; t0=now+400; if(i>=s.beats.length-1){ playing=null; $('play').textContent='▶ Play beats'; s.cur=s.beats.length-1; beats(); draw(); return; } } playing=requestAnimationFrame(step); }; playing=requestAnimationFrame(step); };
function snapshot(){ return cv.toDataURL('image/png'); }
$('b-png').onclick=()=>{ const a=document.createElement('a'); a.href=snapshot(); a.download=(S().name+'-beat-'+(S().cur+1)+'.png').replace(/\s+/g,'-'); a.click(); };
$('b-print').onclick=()=>{ const s=S(), keep=s.cur, imgs=s.beats.map((b,i)=>{ s.cur=i; draw(); return `<div style="break-inside:avoid;margin-bottom:14px"><h3>${e(s.name)} · Beat ${i+1}</h3><p>${e(b.note||'')}</p><img src="${snapshot()}" style="width:100%;border:1px solid #ccc"></div>`; }); s.cur=keep; draw(); FH.print(imgs.join(''), s.name+' blocking'); };
$('b-sl').onclick=()=>{ const s=S(); FH.copy(s.beats.map((b,i)=>`Beat ${i+1}: ${b.note||''} — cameras ${b.cams.map(c=>c.label+' '+c.lens+'mm').join(', ')}`).join('\n')); FH.toast('Blocking notes copied — paste them into the Shot List notes.'); };
addEventListener('resize',resize); side(); beats(); resize();
</script></body></html>
