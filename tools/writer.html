<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Screenplay Writer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css">
<style>
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;display:flex}
.nav{width:230px;border-right:1px solid var(--border);overflow:auto;padding:12px;background:var(--surface);flex-shrink:0}
.nav .s{padding:6px 8px;border-radius:7px;cursor:pointer;font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;line-height:1.35}
.nav .s:hover,.nav .s.on{background:var(--bg);color:var(--text)}.nav .s i{color:var(--accent);font-style:normal;margin-right:6px}
.desk{flex:1;overflow:auto;padding:30px 16px 80px;background:var(--bg)}
.paper{max-width:8.5in;margin:0 auto;background:#fdfcf8;color:#111;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:1in 1in 1in 1.5in;min-height:11in;font:12pt/1.2 'Courier Prime',Courier,monospace;outline:none;border-radius:3px}
body.dark-paper .paper{background:#1a1416;color:#eadfdf}
.el{min-height:1.2em;white-space:pre-wrap;word-wrap:break-word;position:relative}
.el[data-t=scene]{text-transform:uppercase;font-weight:700;margin-top:2em}
.el[data-t=action]{margin-top:1.2em}
.el[data-t=character]{text-transform:uppercase;margin-top:1.2em;margin-left:2.2in}
.el[data-t=paren]{margin-left:1.6in;margin-right:1.9in}
.el[data-t=dialogue]{margin-left:1in;margin-right:1.5in}
.el[data-t=transition]{text-transform:uppercase;text-align:right;margin-top:1.2em}
.el[data-t=shot]{text-transform:uppercase;margin-top:1.2em}
.el[data-t=note]{color:#7a6a00;background:#fff6c4;margin-top:1.2em;font-style:italic}
.el:first-child{margin-top:0}
.el.cur::before{content:attr(data-label);position:absolute;left:-1.4in;width:1.2in;text-align:right;font:600 9px var(--mono);letter-spacing:.08em;color:#b9a8a9;top:3px;text-transform:uppercase;font-style:normal;font-weight:600}
.bar{display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.bar .seg button{font-size:11px;padding:5px 9px}
.stat{font:10.5px var(--mono);color:var(--muted)}
.sug{position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:8px;z-index:20;display:none;min-width:160px;box-shadow:var(--shadow)}
.sug div{padding:6px 10px;font:12px 'Courier Prime',monospace;cursor:pointer}.sug div.on,.sug div:hover{background:var(--accent);color:var(--on-accent)}
@media(max-width:820px){.nav{display:none}.paper{padding:.6in .5in .6in .7in;font-size:10.5pt}.el[data-t=character]{margin-left:1.4in}.el[data-t=dialogue]{margin-left:.5in;margin-right:.4in}.el[data-t=paren]{margin-left:.9in;margin-right:.8in}.el.cur::before{display:none}}
@media print{.nav,.bar,.fh-head{display:none!important}.desk{padding:0;overflow:visible}.paper{box-shadow:none;padding:0;max-width:none;background:#fff!important;color:#000!important}.el.cur::before{display:none}body{height:auto;display:block;overflow:visible}}
</style></head><body>
<div class="bar"><div class="seg" id="types"></div><span class="spacer"></span><span class="stat" id="stat"></span><button class="btn sm" id="paperbtn" title="Dark / light paper">◐</button></div>
<div class="view"><aside class="nav" id="nav"></aside><div class="desk" id="desk"><div class="paper" id="ed" contenteditable="true" spellcheck="true"></div></div></div>
<div class="sug" id="sug"></div>
<script src="common.js"></script>
<script>
const $=id=>document.getElementById(id), e=FH.esc;
FH.header({kicker:'01 · Develop', name:'Screenplay Writer', actions:'<label class="btn">Open .fountain / .txt<input type="file" id="of" accept=".fountain,.txt,.spmd" hidden></label><button class="btn" id="b-fn">Save .fountain</button><button class="btn" id="b-title">Title page</button><button class="btn accent" id="b-pdf">PDF / Print</button>',
  help:'<p>Write in proper screenplay format — the tool handles the layout.</p><p><b>Enter</b> moves to the next logical element (scene → action, character → dialogue, dialogue → action). <b>Tab</b> changes the current element: action → character → parenthetical → dialogue → transition. Or use the buttons above, or shortcuts Ctrl/⌘+1…7.</p><p>Type a scene heading starting with INT. or EXT. and it becomes a scene automatically. Character names autocomplete. Your script is the same one used by Script Development and Script Breakdown.</p>'});
const TYPES=[['scene','Scene heading'],['action','Action'],['character','Character'],['paren','Parenthetical'],['dialogue','Dialogue'],['transition','Transition'],['shot','Shot'],['note','Note']];
const LABEL=Object.fromEntries(TYPES);
const NEXT={scene:'action',action:'action',character:'dialogue',paren:'dialogue',dialogue:'character',transition:'scene',shot:'action',note:'action'};
const TAB={action:'character',character:'paren',paren:'dialogue',dialogue:'transition',transition:'scene',scene:'shot',shot:'action',note:'action'};
let S=FH.load('script', ()=>({}));
$('types').innerHTML=TYPES.slice(0,7).map(([k,l],i)=>`<button data-ty="${k}" title="${l} (Ctrl/⌘+${i+1})">${l}</button>`).join('');
/* ---------- fountain <-> elements ---------- */
function parse(txt){ const L=String(txt||'').replace(/\r/g,'').split('\n'), out=[]; let i=0;
  if(/^(title|credit|author|draft date|contact)\s*:/i.test(L[0]||'')){ while(i<L.length&&L[i].trim()) i++; }
  for(;i<L.length;i++){ const l=L[i], t=l.trim(); if(!t) continue; const prevBlank=!L[i-1]||!L[i-1].trim(), next=L[i+1];
    if(/^\[\[.*\]\]$/.test(t)){ out.push({t:'note',x:t.slice(2,-2)}); continue; }
    if(/^(INT|EXT|EST|INT\.?\/EXT|I\/E)[\.\s]/i.test(t)||/^\.[^.]/.test(t)){ out.push({t:'scene',x:t.replace(/^\./,'')}); continue; }
    if(/^>.*[^<]$/.test(t)||(/^[A-Z\s]+TO:$/.test(t)&&prevBlank)){ out.push({t:'transition',x:t.replace(/^>\s*/,'')}); continue; }
    if(prevBlank&&next&&next.trim()&&(/^@/.test(t)||(t===t.toUpperCase()&&/[A-Z]/.test(t)&&!/^[!]/.test(t)&&t.length<40))){ out.push({t:'character',x:t.replace(/^@/,'')}); i++;
      for(;i<L.length&&L[i].trim();i++){ const d=L[i].trim(); out.push(/^\(.*\)$/.test(d)?{t:'paren',x:d.slice(1,-1)}:{t:'dialogue',x:d}); } continue; }
    let x=t.replace(/^!/,''); while(L[i+1]&&L[i+1].trim()) x+='\n'+L[++i].trim(); out.push({t:'action',x}); }
  return out.length?out:[{t:'scene',x:''}]; }
function toFountain(els){ let o=[]; els.forEach((el,i)=>{ const x=el.x.replace(/ /g,' '); if(!x.trim()&&el.t!=='dialogue') return;
  if(['scene','action','character','transition','shot','note'].includes(el.t)&&o.length) o.push('');
  if(el.t==='scene') o.push(/^(INT|EXT|EST|I\/E)/i.test(x.trim())?x.toUpperCase():'.'+x.toUpperCase());
  else if(el.t==='character') o.push(x.toUpperCase()===x&&/[A-Z]/.test(x)?x.toUpperCase():'@'+x);
  else if(el.t==='paren') o.push('('+x.replace(/^\(|\)$/g,'')+')');
  else if(el.t==='transition') o.push(/TO:$/.test(x.toUpperCase())?x.toUpperCase():'> '+x.toUpperCase());
  else if(el.t==='note') o.push('[['+x+']]');
  else if(el.t==='action'&&x===x.toUpperCase()&&/[A-Z]{3}/.test(x)) o.push('!'+x);
  else o.push(x); }); return o.join('\n')+'\n'; }
/* ---------- editor ---------- */
const ed=$('ed');
function render(els){ ed.innerHTML=els.map(el=>`<div class="el" data-t="${el.t}" data-label="${LABEL[el.t]}">${e(el.x)||'<br>'}</div>`).join(''); }
function els(){ return [...ed.children].map(d=>({t:d.dataset.t||'action', x:d.innerText.replace(/\n$/,'')})); }
function curEl(){ const s=getSelection(); if(!s.rangeCount) return null; let n=s.anchorNode; while(n&&n.parentNode!==ed) n=n.parentNode; return n&&n.classList&&n.classList.contains('el')?n:null; }
function caretAt(el, end){ const r=document.createRange(); r.selectNodeContents(el); r.collapse(!end); const s=getSelection(); s.removeAllRanges(); s.addRange(r); el.scrollIntoView({block:'nearest'}); }
function setType(el,t){ if(!el) return; el.dataset.t=t; el.dataset.label=LABEL[t]; mark(); changed(); }
function mark(){ ed.querySelectorAll('.el.cur').forEach(x=>x.classList.remove('cur')); const c=curEl(); if(c) c.classList.add('cur'); document.querySelectorAll('[data-ty]').forEach(b=>b.classList.toggle('on',c&&b.dataset.ty===c.dataset.t)); }
let tm; function changed(){ clearTimeout(tm); tm=setTimeout(()=>{ const E=els(); S=FH.load('script',{})||{}; S.text=toFountain(E); FH.save('script',S); nav(E); stat(E); },350); }
function nav(E){ let n=0; const cur=curEl(), all=[...ed.children]; $('nav').innerHTML='<div class="label">Scenes</div>'+E.map((el,i)=>el.t==='scene'?`<div class="s" data-i="${i}"><i>${++n}</i>${e(el.x||'New scene')}</div>`:'').join('')+(n?'':'<p class="hint">Scene headings appear here.</p>');
  $('nav').querySelectorAll('[data-i]').forEach(s=>s.onclick=()=>{ const el=all[+s.dataset.i]||ed.children[+s.dataset.i]; if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); caretAt(el,true); mark(); } }); }
function stat(E){ const lines=E.reduce((s,el)=>s+Math.max(1,Math.ceil(el.x.length/(el.t==='dialogue'?35:el.t==='paren'?25:60)))+(['dialogue','paren'].includes(el.t)?0:1),0); const pages=lines/55;
  $('stat').textContent=`${E.filter(x=>x.t==='scene').length} scenes · ≈ ${pages<1?'<1':pages.toFixed(1)} pages (~${Math.max(1,Math.round(pages))} min) · ${E.map(x=>x.x).join(' ').split(/\s+/).filter(Boolean).length} words`; }
function chars(){ return [...new Set(els().filter(x=>x.t==='character').map(x=>x.x.toUpperCase().replace(/\s*\(.*\)$/,'').trim()).filter(Boolean))]; }
ed.addEventListener('keydown',ev=>{ const el=curEl(); if(!el) return; const mod=ev.metaKey||ev.ctrlKey;
  if(sugOn&&(ev.key==='ArrowDown'||ev.key==='ArrowUp')){ ev.preventDefault(); sugI=(sugI+(ev.key==='ArrowDown'?1:-1)+sugL.length)%sugL.length; showSug(el); return; }
  if(sugOn&&(ev.key==='Enter'||ev.key==='Tab')){ ev.preventDefault(); el.textContent=sugL[sugI]; hideSug(); }
  if(mod&&/^[1-8]$/.test(ev.key)){ ev.preventDefault(); setType(el,TYPES[+ev.key-1][0]); return; }
  if(ev.key==='Tab'){ ev.preventDefault(); const t=el.dataset.t; setType(el, ev.shiftKey?Object.keys(TAB).find(k=>TAB[k]===t)||'action':(t==='action'&&el.innerText.trim()?'action':TAB[t])); if(t==='action'&&el.innerText.trim()) setType(el,'character'); return; }
  if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); hideSug(); const s=getSelection(), r=s.getRangeAt(0); const after=document.createRange(); after.setStart(r.endContainer,r.endOffset); after.setEndAfter(el.lastChild||el); const tail=after.toString(); after.deleteContents(); if(!el.innerText.trim()) el.innerHTML='<br>';
    let t=el.dataset.t; if(!el.innerText.trim()&&t!=='action'){ setType(el, t==='dialogue'?'action':t==='character'?'action':'action'); return; }
    if(t==='action'&&/^(INT|EXT|EST|I\/E)[\.\s]/i.test(el.innerText.trim())) setType(el,'scene'), t='scene';
    if(t==='action'&&/^[A-Z\s]+TO:$/.test(el.innerText.trim())) setType(el,'transition'), t='transition';
    const n=document.createElement('div'); n.className='el'; const nt=NEXT[t]; n.dataset.t=nt; n.dataset.label=LABEL[nt]; n.textContent=tail; if(!tail) n.innerHTML='<br>'; el.after(n); caretAt(n,false); mark(); changed(); return; }
  if(ev.key==='Backspace'){ const s=getSelection(); if(s.isCollapsed){ const r=document.createRange(); r.selectNodeContents(el); r.setEnd(s.anchorNode,s.anchorOffset); if(r.toString()===''&&el.previousElementSibling){ ev.preventDefault(); const p=el.previousElementSibling, txt=el.innerText.replace(/\n$/,''); const len=p.innerText.replace(/\n$/,'').length; if(p.innerHTML==='<br>') p.textContent=''; p.append(document.createTextNode(txt)); el.remove(); const r2=document.createRange(); let node=p, off=0, rem=len; const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT); while(w.nextNode()){ if(rem<=w.currentNode.length){ node=w.currentNode; off=rem; break; } rem-=w.currentNode.length; } r2.setStart(node,off); r2.collapse(true); s.removeAllRanges(); s.addRange(r2); mark(); changed(); } } } });
let sugOn=false, sugL=[], sugI=0;
function showSug(el){ const b=$('sug'); b.innerHTML=sugL.map((c,i)=>`<div class="${i===sugI?'on':''}" data-c="${e(c)}">${e(c)}</div>`).join(''); const r=el.getBoundingClientRect(); b.style.left=(r.left+parseFloat(getComputedStyle(el).marginLeft)*0)+'px'; b.style.top=(r.bottom+4)+'px'; b.style.display='block'; sugOn=true; b.querySelectorAll('[data-c]').forEach(d=>d.onmousedown=ev=>{ ev.preventDefault(); el.textContent=d.dataset.c; hideSug(); caretAt(el,true); changed(); }); }
function hideSug(){ $('sug').style.display='none'; sugOn=false; }
ed.addEventListener('input',()=>{ const el=curEl(); if(el&&el.dataset.t==='action'&&/^(INT|EXT|EST|I\/E)[\.\s]$/i.test(el.innerText)) setType(el,'scene');
  if(el&&el.dataset.t==='character'){ const q=el.innerText.trim().toUpperCase(); sugL=q?chars().filter(c=>c.startsWith(q)&&c!==q).slice(0,6):[]; sugI=0; sugL.length?showSug(el):hideSug(); } else hideSug();
  [...ed.childNodes].forEach(n=>{ if(n.nodeType===3||(n.nodeType===1&&!n.classList.contains('el'))){ const d=document.createElement('div'); d.className='el'; d.dataset.t='action'; d.dataset.label='Action'; n.replaceWith(d); d.append(n.nodeType===3?n:document.createTextNode(n.textContent)); } });
  if(!ed.children.length){ render([{t:'scene',x:''}]); caretAt(ed.firstChild); } changed(); });
ed.addEventListener('paste',ev=>{ ev.preventDefault(); const t=(ev.clipboardData||window.clipboardData).getData('text'); if(!t) return; if(t.includes('\n')){ const el=curEl(); const parsed=parse(t); const frag=document.createDocumentFragment(); let last; parsed.forEach(p=>{ const d=document.createElement('div'); d.className='el'; d.dataset.t=p.t; d.dataset.label=LABEL[p.t]; d.textContent=p.x; frag.append(d); last=d; }); if(el){ if(!el.innerText.trim()) el.replaceWith(frag); else el.after(frag); } else ed.append(frag); if(last) caretAt(last,true); } else document.execCommand('insertText',false,t); mark(); changed(); });
document.addEventListener('selectionchange',()=>{ if(ed.contains(getSelection().anchorNode)) mark(); });
document.querySelectorAll('[data-ty]').forEach(b=>b.onmousedown=ev=>{ ev.preventDefault(); setType(curEl()||ed.lastElementChild,b.dataset.ty); });
$('paperbtn').onclick=()=>{ document.body.classList.toggle('dark-paper'); FH.LS.set('fh:darkpaper',document.body.classList.contains('dark-paper')); }; if(FH.LS.get('fh:darkpaper')) document.body.classList.add('dark-paper');
$('b-fn').onclick=()=>{ const tp=S.titlePage||{}; const head=tp.title?`Title: ${tp.title}\nCredit: Written by\nAuthor: ${tp.author||''}\nDraft date: ${tp.date||''}\nContact: ${tp.contact||''}\n\n`:''; FH.download(((tp.title||FH.currentProject().name)+'.fountain').replace(/\s+/g,'-'), head+toFountain(els()), 'text/plain'); };
$('of').onchange=async ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(!f) return; const t=await f.text(); FH.confirm('Replace the current script?','Opens '+f.name+'. Save a .fountain copy first if you want to keep this version.','Open',()=>{ render(parse(t)); changed(); nav(els()); stat(els()); }); };
$('b-title').onclick=()=>{ const tp=S.titlePage||{}; FH.modal(`<h3>Title page</h3>${[['title','Title',tp.title||FH.currentProject().name],['author','Written by',tp.author||''],['date','Draft / date',tp.date||''],['contact','Contact',tp.contact||'']].map(([k,l,v])=>`<div class="field"><label>${l}</label><input id="tp-${k}" value="${e(v)}"></div>`).join('')}<div class="acts"><button class="btn" onclick="FH.close()">Cancel</button><button class="btn accent" id="tp-ok">Save</button></div>`); $('tp-ok').onclick=()=>{ S=FH.load('script',{})||{}; S.titlePage={title:$('tp-title').value,author:$('tp-author').value,date:$('tp-date').value,contact:$('tp-contact').value}; FH.save('script',S); FH.close(); FH.toast('Title page saved — it prints as page 1.'); }; };
$('b-pdf').onclick=()=>{ const tp=(FH.load('script',{})||{}).titlePage; const st=`<style>@page{size:A4;margin:1in 1in 1in 1.5in}body{font:12pt/1.2 'Courier Prime',Courier,monospace;color:#000}.el{white-space:pre-wrap}.el[data-t=scene]{font-weight:700;text-transform:uppercase;margin-top:2em;page-break-after:avoid}.el[data-t=action],.el[data-t=shot]{margin-top:1.2em}.el[data-t=character]{text-transform:uppercase;margin:1.2em 0 0 2.2in;page-break-after:avoid}.el[data-t=paren]{margin:0 1.9in 0 1.6in}.el[data-t=dialogue]{margin:0 1.5in 0 1in}.el[data-t=transition]{text-align:right;text-transform:uppercase;margin-top:1.2em}.el[data-t=note]{display:none}.tp{height:9in;display:flex;flex-direction:column;justify-content:center;text-align:center;page-break-after:always}.tp .c{position:absolute;bottom:1in;left:1.5in;text-align:left}</style><link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">`;
  const title=tp&&tp.title?`<div class="tp"><div style="text-transform:uppercase;text-decoration:underline">${e(tp.title)}</div><br><div>Written by</div><br><div>${e(tp.author||'')}</div><div class="c">${e(tp.date||'')}<br>${e(tp.contact||'')}</div></div>`:'';
  const w=window.open('','_blank'); if(!w){ print(); return; } w.document.write(`<html><head><title>${e((tp&&tp.title)||'Screenplay')}</title>${st}</head><body>${title}${els().map(x=>`<div class="el" data-t="${x.t}">${e(x.t==='paren'?'('+x.x.replace(/^\(|\)$/g,'')+')':x.x)}</div>`).join('')}<script>setTimeout(()=>print(),700)<\/script></body></html>`); w.document.close(); };
render(parse(S.text)); nav(els()); stat(els()); setTimeout(()=>{ caretAt(ed.lastElementChild,true); mark(); },50);
</script></body></html>
