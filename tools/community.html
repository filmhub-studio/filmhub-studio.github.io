<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Community</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css">
<style>
.cgrid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}@media(max-width:1000px){.cgrid{grid-template-columns:1fr}}
.discord{background:linear-gradient(135deg,#5865f2,#4752c4);color:#fff;border:none}
.discord h3{font-size:22px}.discord p{color:#e3e6ff;font-size:13px;margin:4px 0 14px}
.discord .btn{background:#fff;color:#4752c4;border-color:#fff}
.widget{width:100%;height:420px;border:none;border-radius:12px;margin-top:12px;background:var(--surface2)}
.compose textarea{min-height:84px}
.note{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.note.pinned{border-color:var(--accent)}
.nh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.nh img,.nh .av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface3);display:grid;place-items:center;font-weight:700;font-size:12px}
.nh b{font-weight:600}.nh i{font:10.5px var(--mono);color:var(--muted);font-style:normal}
.note .txt{white-space:pre-wrap;font-size:13.5px;line-height:1.6;word-break:break-word}
.note .acts{display:flex;gap:6px;margin-top:10px;align-items:center}
.tag{font:600 10px var(--mono);padding:2px 8px;border-radius:10px;background:var(--glow);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.replies{margin-top:10px;border-left:2px solid var(--border2);padding-left:12px}.replies div{font-size:12.5px;margin-bottom:6px}.replies b{font-weight:600}
.people{display:flex;flex-direction:column;gap:8px}.people div{display:flex;align-items:center;gap:10px;font-size:13px}.people img,.people .av{width:28px;height:28px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:700}
.people i{margin-left:auto;font:10px var(--mono);color:var(--muted);font-style:normal}
.gate{max-width:520px;margin:60px auto;text-align:center}
</style></head><body>
<div class="wrap" id="root"><div class="empty">Loading…</div></div>
<script src="common.js"></script><script src="cloud.js"></script>
<script>
FH.header({kicker:'Film Hub', name:'Community', actions:'', help:'<p>Everyone signed in to your Film Hub can read and post here. Use it for crew calls, kit swaps, questions and sharing work. For live chat, jump into the Discord server.</p><p>Only the first person to save the Discord settings (you) can change them later.</p>'});
const TAGS=['General','Crew call','Question','Kit','Tip','Showcase','Feedback'];
let me=null, notes=[], cfg={}, people=[], filter='All'; const e=FH.esc, $=id=>document.getElementById(id);
const ago=t=>{ const m=Math.round((Date.now()-t)/60000); return m<1?'just now':m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'; };
const av=(name,photo)=>photo?`<img src="${e(photo)}" referrerpolicy="no-referrer">`:`<span class="av">${e(String(name||'?').trim().slice(0,1).toUpperCase())}</span>`;
function gate(msg){ $('root').innerHTML=`<div class="gate card"><h3 style="font-size:24px;margin-bottom:6px">Join the community</h3><p class="hint" style="margin-bottom:16px">${msg||'Sign in with Google to see the notes board and who else is here.'}</p><button class="btn accent" id="si">Sign in with Google</button>${cfg.invite?`<p class="hint" style="margin-top:16px">Or go straight to <a href="${e(cfg.invite)}" target="_blank" rel="noopener">our Discord</a>.</p>`:''}</div>`; $('si').onclick=async()=>{ try{ await FHCloud.signIn(); }catch(err){ FH.toast(FHCloud.explain(err)); } }; }
function render(){ if(!me) return gate();
  const list=notes.filter(n=>filter==='All'||n.tag===filter).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.at-a.at);
  const wid=cfg.serverId?`<iframe class="widget" src="https://discord.com/widget?id=${encodeURIComponent(cfg.serverId)}&theme=${document.documentElement.dataset.theme==='light'?'light':'dark'}" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>`:'';
  $('root').innerHTML=`<div class="cgrid"><main>
    <div class="card compose"><div class="label">Post a note</div><textarea id="txt" placeholder="Need a boom op on Saturday? Found a great location? Ask, share, show your work…" maxlength="2000"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap"><select id="tg" style="width:auto">${TAGS.map(t=>`<option>${t}</option>`).join('')}</select><span class="spacer"></span><button class="btn accent" id="post">Post</button></div></div>
    <div class="chips" style="margin:16px 0">${['All',...TAGS].map(t=>`<span class="chip ${t===filter?'on':''}" data-f="${t}">${t}</span>`).join('')}</div>
    ${list.length?list.map(n=>`<div class="note ${n.pinned?'pinned':''}"><div class="nh">${av(n.name,n.photo)}<div><b>${e(n.name)}</b><br><i>${ago(n.at)} ago</i></div><span class="spacer"></span>${n.pinned?'<span class="pill">📌 pinned</span>':''}<span class="tag">${e(n.tag||'General')}</span></div><div class="txt">${linkify(e(n.text))}</div>
      ${(n.replies||[]).length?`<div class="replies">${n.replies.map(r=>`<div><b>${e(r.name)}</b> <span class="hint">${ago(r.at)}</span><br>${linkify(e(r.text))}</div>`).join('')}</div>`:''}
      <div class="acts"><button class="btn sm" data-like="${n.id}">${(n.likes||[]).includes(me.uid)?'♥':'♡'} ${(n.likes||[]).length||''}</button><button class="btn sm ghost" data-reply="${n.id}">Reply</button>${cfg.owner===me.uid?`<button class="btn sm ghost" data-pin="${n.id}">${n.pinned?'Unpin':'Pin'}</button>`:''}${n.uid===me.uid||cfg.owner===me.uid?`<button class="btn sm ghost danger" data-del="${n.id}">Delete</button>`:''}</div></div>`).join(''):'<div class="empty">No notes yet. Be the first to post.</div>'}
  </main><aside>
    <div class="card discord"><h3>Discord</h3><p>${cfg.invite?'Live chat, voice calls and screenings with the crew.':'Add your server invite to bring everyone together.'}</p>${cfg.invite?`<a class="btn" href="${e(cfg.invite)}" target="_blank" rel="noopener">Join the server →</a>`:''}${(!cfg.owner||cfg.owner===me.uid)?`<button class="btn" id="dset" style="margin-left:6px;background:rgba(255,255,255,.18);color:#fff;border-color:transparent">Settings</button>`:''}${wid}</div>
    <div class="card"><div class="label">People here · ${people.length}</div><div class="people">${people.map(p=>`<div>${av(p.name,p.photo)}<span>${e(p.name)}</span><i>${ago(p.lastSeen)}</i></div>`).join('')}</div></div>
  </aside></div>`;
  $('post').onclick=async()=>{ const t=$('txt').value.trim(); if(!t) return; $('post').disabled=true; try{ await FHCloud.db().collection('community_notes').add({text:t, tag:$('tg').value, uid:me.uid, name:me.displayName||me.email, photo:me.photoURL||'', at:Date.now(), likes:[], replies:[]}); }catch(err){ FH.toast(FHCloud.explain(err)); $('post').disabled=false; } };
  document.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{ filter=c.dataset.f; render(); });
  const ref=id=>FHCloud.db().collection('community_notes').doc(id), FV=firebase.firestore.FieldValue;
  document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{ const n=notes.find(x=>x.id===b.dataset.like); ref(n.id).update({likes:(n.likes||[]).includes(me.uid)?FV.arrayRemove(me.uid):FV.arrayUnion(me.uid)}).catch(err=>FH.toast(FHCloud.explain(err))); });
  document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>FH.prompt('Reply','Your reply','',t=>{ if(t) ref(b.dataset.reply).update({replies:FV.arrayUnion({uid:me.uid,name:me.displayName||me.email,text:t,at:Date.now()})}).catch(err=>FH.toast(FHCloud.explain(err))); },'Reply'));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>FH.confirm('Delete this note?','It is removed for everyone.','Delete',()=>ref(b.dataset.del).delete().catch(err=>FH.toast(FHCloud.explain(err)))));
  document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{ const n=notes.find(x=>x.id===b.dataset.pin); ref(n.id).update({pinned:!n.pinned}); });
  const ds=$('dset'); if(ds) ds.onclick=()=>{ FH.modal(`<h3>Discord settings</h3><p>Invite link: in Discord, right-click your server → Invite People → Edit invite link → set “Expire after” to Never → copy.<br>Server ID (optional, shows who's online): Server Settings → Widget → Enable Server Widget → copy Server ID.</p><div class="field"><label>Invite link</label><input type="text" id="di" value="${e(cfg.invite||'')}" placeholder="https://discord.gg/…"></div><div class="field"><label>Server ID</label><input type="text" id="dsid" value="${e(cfg.serverId||'')}" placeholder="123456789012345678"></div><div class="acts"><button class="btn" onclick="FH.close()">Cancel</button><button class="btn accent" id="dok">Save</button></div>`);
    $('dok').onclick=async()=>{ try{ await FHCloud.db().collection('community_config').doc('main').set({invite:$('di').value.trim(), serverId:$('dsid').value.trim().replace(/\D/g,''), owner:cfg.owner||me.uid}); FH.close(); FH.toast('Saved for everyone.'); }catch(err){ FH.toast(FHCloud.explain(err)); } }; };
}
function linkify(s){ return s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
FHCloud.ready().then(()=>{ FHCloud.onAuth(u=>{ me=u; if(!u){ gate(); return; } const db=FHCloud.db();
  db.collection('community_config').doc('main').onSnapshot(d=>{ cfg=d.data()||{}; render(); }, ()=>{});
  db.collection('community_notes').orderBy('at','desc').limit(200).onSnapshot(s=>{ notes=s.docs.map(d=>Object.assign({id:d.id},d.data())); render(); }, err=>gate(FHCloud.explain(err)));
  db.collection('hub_users').orderBy('lastSeen','desc').limit(40).onSnapshot(s=>{ people=s.docs.map(d=>d.data()); render(); }, ()=>{}); }); })
 .catch(()=>{ $('root').innerHTML='<div class="gate card"><h3 style="font-size:22px">Community is offline</h3><p class="hint">It needs the internet and your Firebase project. Open the hub from your live site (GitHub Pages or Netlify).</p></div>'; });
</script></body></html>
